<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Preview - Sioto Jazz</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Astrella';
            src: url('truestate/Astrella.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Garet';
            src: url('Garet.ttf') format('truetype');
        }

        body {
            margin: 0 auto;
            width: 100%;
            background-color: #090909; /* Deep black */
            font-family: 'Garet', 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            padding: 16px 0; /* Vertical padding */
            font-size: clamp(12.8px, 2vw, 14.4px);
            color: #e0e0e0; /* Soft off-white */
            display: flex;
            justify-content: center;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 320px; /* Fixed width */
        }

        .songContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 320px; /* Fixed width */
        }

        .albumCover {
            width: 320px; /* Fixed width */
            height: 320px;
            background-size: cover;
            background-position: center;
            background-color: #1a1a1a; /* Less black */
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.2)); /* Black-gray gradient */
        }

        .textContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px; /* Spacing between song and band name */
            width: 320px; /* Fixed width */
            background-color: #1a1a1a; /* Less black */
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.2)); /* Black-gray gradient */
            padding: 16px 12px; /* Adjusted for centering */
            text-align: center;
        }

        .bandName {
            font-family: 'Astrella', 'Garet', 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: clamp(14px, 2.8vw, 18px);
            font-weight: normal;
            color: #f4ebdd !important; /* Creamy off-white */
            line-height: 1.3; /* For spacing */
        }

        .songName {
            font-family: 'Astrella', 'Garet', 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: clamp(48px, 9.6vw, 56px);
            font-weight: bold;
            color: #f4ebdd !important; /* Creamy off-white */
            line-height: 1.2; /* For spacing */
            display: block !important; /* Ensure visibility */
        }

        .linkContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 320px; /* Fixed width */
            background-color: #101010 !important; /* Darker black for buttons */
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.2)) !important; /* Black-gray gradient */
            padding: 12px;
        }

        .linkRow {
            display: flex;
            justify-content: flex-start; /* Reverted to flex-start as playText is inside linkButton */
            align-items: center;
            width: 100%;
        }

        .linkButton {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Space between platform text and playText */
            width: 100%; /* Full width to allow playText to align right */
            gap: 6.4px;
            text-decoration: none;
            color: #e0e0e0; /* Soft off-white */
            font-family: 'Garet', 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: clamp(14.4px, 2.24vw, 16px);
            font-weight: normal;
            background: none !important; /* No background */
            text-shadow: 1px 1px 2px #000000 !important; /* Black shadow for 3D */
            transform: perspective(500px) translateZ(2px); /* 3D effect */
            transition: all 0.3s ease;
        }

        .linkButton:hover {
            color: #ffffff !important; /* Brighter white */
            text-shadow: 4px 4px 8px #000000 !important; /* Stronger black shadow for 3D */
            transform: perspective(500px) translateZ(15px) scale(1.05) rotateY(15deg) skewX(-8deg) !important; /* Radical 3D with rotation and skew */
            filter: brightness(1.2) !important; /* Brightness pop */
        }

        .linkButton i {
            font-size: clamp(16px, 2.4vw, 17.6px);
            text-shadow: 1px 1px 2px #000000 !important; /* Black shadow for 3D */
        }

        .linkButton:hover i {
            text-shadow: 4px 4px 8px #000000 !important; /* Stronger black shadow for 3D */
        }

        .linkButton i.fa-spotify {
            color: #1DB954 !important; /* Spotify green */
        }

        .linkButton:hover i.fa-spotify {
            color: #2ed46b !important; /* Brighter green */
        }

        .linkButton i.fa-youtube {
            color: #ff0000 !important; /* YouTube red */
        }

        .linkButton:hover i.fa-youtube {
            color: #ff3333 !important; /* Brighter red */
        }

        .platformText {
            display: flex;
            align-items: center;
            gap: 6.4px; /* Space between icon and platform name */
        }

        .playText {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: clamp(10px, 1.6vw, 12px); /* Smaller font size */
            opacity: 0.5; /* 50% transparent */
            color: #e0e0e0; /* Soft off-white */
            text-transform: uppercase; /* All caps */
        }

        .playText i {
            font-size: clamp(8px, 1.2vw, 10px); /* Smaller icon size */
            text-shadow: 1px 1px 2px #000000 !important; /* Black shadow for 3D */
        }

        .linkButton:hover .playText {
            color: #ffffff !important; /* Brighter white on hover */
            opacity: 0.7; /* Slightly more opaque on hover */
        }

        .linkButton:hover .playText i {
            text-shadow: 4px 4px 8px #000000 !important; /* Stronger shadow on hover */
        }
    </style>

</head>
<body>
    <main>
        <div class="songContainer">
            <div class="albumCover" style="background-image: url('../merch/live_session_cover.jpg');"></div>
            <div class="textContainer">
                <div class="songName" id="songName"></div>
                <div class="bandName">SIOTO JAZZ</div>
            </div>
            <div class="linkContainer">
                <div class="linkRow">
                    <a href="#" class="linkButton" id="primaryLink">
                        <span class="platformText">
                            <i class="fab fa-spotify" id="linkIcon" aria-hidden="true"></i>
                            <span id="linkText">Spotify</span>
                        </span>
                        <span class="playText"><i class="fas fa-play"></i> PLAY</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Check Font Awesome loading
        window.onload = function() {
            if (typeof window.FontAwesome === 'undefined') {
                console.warn('Font Awesome failed to load. Check CDN.');
            } else {
                console.log('Font Awesome loaded successfully.');
            }
        };
    
        const trackMap = {
            'jetpacks': {
                id: '4zsjiqocsDqutg8UStfhJQ',
                name: 'Jetpacks',
                spotifyUri: 'spotify:track:4zsjiqocsDqutg8UStfhJQ',
                spotifyWeb: 'https://open.spotify.com/track/4zsjiqocsDqutg8UStfhJQ',
                youtube: 'https://www.youtube.com/watch?v=yvLuSa4OSZM&t=100s'
            },
            'mad': {
                id: '7gXbFB9gOuqMxSLwd7P7Pk',
                name: 'Mad',
                spotifyUri: 'spotify:track:7gXbFB9gOuqMxSLwd7P7Pk',
                spotifyWeb: 'https://open.spotify.com/track/7gXbFB9gOuqMxSLwd7P7Pk',
                youtube: 'https://www.youtube.com/watch?v=yvLuSa4OSZM&t=305s'
            },
            'language': {
                id: '11CUEDRt6gFM5WBQYc3Rap',
                name: 'Language',
                spotifyUri: 'spotify:track:11CUEDRt6gFM5WBQYc3Rap',
                spotifyWeb: 'https://open.spotify.com/track/11CUEDRt6gFM5WBQYc3Rap',
                youtube: 'https://www.youtube.com/watch?v=yvLuSa4OSZM&t=562s'
            },
            'again': {
                id: '6myfKNR3uvv4907UVPRvbf',
                name: 'Again',
                spotifyUri: 'spotify:track:6myfKNR3uvv4907UVPRvbf',
                spotifyWeb: 'https://open.spotify.com/track/6myfKNR3uvv4907UVPRvbf',
                youtube: 'https://www.youtube.com/watch?v=yvLuSa4OSZM&t=733s'
            },
            'patience': {
                id: '06hihmTizTKpVeKbBSYftq',
                name: 'Patience',
                spotifyUri: 'spotify:track:06hihmTizTKpVeKbBSYftq',
                spotifyWeb: 'https://open.spotify.com/track/06hihmTizTKpVeKbBSYftq',
                youtube: 'https://www.youtube.com/watch?v=yvLuSa4OSZM&t=968s'
            },
            'sun': {
                id: '44VovVLdQ9MiCCxgTJPkL8',
                name: 'Sun',
                spotifyUri: 'spotify:track:44VovVLdQ9MiCCxgTJPkL8',
                spotifyWeb: 'https://open.spotify.com/track/44VovVLdQ9MiCCxgTJPkL8',
                youtube: 'https://www.youtube.com/watch?v=yvLuSa4OSZM&t=1227s'
            },
            'empire state space station': {
                id: '3E64ltmlCQ0DNiKv06kfQJ',
                name: 'Empire State Space Station',
                spotifyUri: 'spotify:track:3E64ltmlCQ0DNiKv06kfQJ',
                spotifyWeb: 'https://open.spotify.com/track/3E64ltmlCQ0DNiKv06kfQJ',
                youtube: 'https://www.youtube.com/watch?v=yvLuSa4OSZM&t=1456s'
            },
            'ink': {
                id: '2HRnjwDFFDC8JuKg4VRwyA',
                name: 'Ink',
                spotifyUri: 'spotify:track:2HRnjwDFFDC8JuKg4VRwyA',
                spotifyWeb: 'https://open.spotify.com/track/2HRnjwDFFDC8JuKg4VRwyA',
                youtube: 'https://www.youtube.com/watch?v=yvLuSa4OSZM&t=1748s'
            },
            'rites': {
                id: '68WiBvGPnmGpboXHO1900Y',
                name: 'Rites',
                spotifyUri: 'spotify:track:68WiBvGPnmGpboXHO1900Y',
                spotifyWeb: 'https://open.spotify.com/track/68WiBvGPnmGpboXHO1900Y',
                youtube: 'https://www.youtube.com/watch?v=yvLuSa4OSZM&t=2169s'
            },
            'dreams': {
                id: '2t0mB1FE5g0hO7BSikisfU',
                name: 'Dreams',
                spotifyUri: 'spotify:track:2t0mB1FE5g0hO7BSikisfU',
                spotifyWeb: 'https://open.spotify.com/track/2t0mB1FE5g0hO7BSikisfU',
                youtube: 'https://www.youtube.com/watch?v=yvLuSa4OSZM&t=2258s'
            }
        };
    
        function getTrackNameFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const trackName = params.get('name');
            if (trackName) {
                console.log('Track name from URL:', trackName);
                return decodeURIComponent(trackName).toLowerCase().trim();
            }
            console.log('No track name in URL, using default');
            return null;
        }
    
        function getLinkTypeFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const linkType = params.get('link');
            if (linkType) {
                console.log('Link type from URL:', linkType);
                return linkType.toLowerCase().trim();
            }
            console.log('No link type in URL, using default');
            return 'spotify';
        }
    
        function openSpotifyLink(track, fallbackUrl) {
            const spotifyUri = track.spotifyUri;
            // Attempt to open the Spotify app
            window.location.href = spotifyUri;
    
            // Fallback to web link if the app doesn't open after a short delay
            setTimeout(() => {
                // Check if the page is still active (i.e., app didn't open)
                if (document.hasFocus()) {
                    console.log('Spotify app not opened, falling back to web link:', fallbackUrl);
                    window.location.href = fallbackUrl;
                }
            }, 1000); // 1-second delay to allow app to open
        }
    
        function updateSongDetails(trackName, linkType) {
            const songNameElement = document.getElementById('songName');
            const primaryLinkElement = document.getElementById('primaryLink');
            const linkIconElement = document.getElementById('linkIcon');
            const linkTextElement = document.getElementById('linkText');
    
            const track = trackMap[trackName] || trackMap['jetpacks'];
            console.log('Selected track:', track);
    
            if (songNameElement) {
                songNameElement.textContent = track.name;
                console.log('Song name set to:', track.name);
            } else {
                console.error('Song name element not found');
            }
    
            if (primaryLinkElement && linkIconElement && linkTextElement) {
                if (linkType === 'youtube') {
                    primaryLinkElement.href = track.youtube;
                    linkIconElement.className = 'fab fa-youtube';
                    linkTextElement.textContent = 'YouTube';
                    console.log('YouTube link set to:', track.youtube);
                    // Remove onclick for YouTube to avoid interference
                    primaryLinkElement.onclick = null;
                } else {
                    // Set a placeholder href to avoid default navigation
                    primaryLinkElement.href = '#';
                    linkIconElement.className = 'fab fa-spotify';
                    linkTextElement.textContent = 'Spotify';
                    console.log('Spotify URI set to:', track.spotifyUri);
                    // Add click event to handle Spotify URI and fallback
                    primaryLinkElement.onclick = (e) => {
                        e.preventDefault(); // Prevent default anchor behavior
                        openSpotifyLink(track, track.spotifyWeb);
                    };
                }
            } else {
                console.error('Link elements not found');
            }
        }
    
        const defaultTrackName = 'jetpacks';
        const defaultLinkType = 'spotify';
        const trackName = getTrackNameFromUrl() || defaultTrackName;
        const linkType = getLinkTypeFromUrl() || defaultLinkType;
        console.log('Final track name:', trackName);
        console.log('Final link type:', linkType);
    
        if (!trackMap[trackName]) {
            const songNameElement = document.getElementById('songName');
            if (songNameElement) {
                songNameElement.textContent = trackMap['jetpacks'].name;
                songNameElement.style.color = '#ff0000';
                songNameElement.title = 'Invalid track name. Showing default track.';
                console.log('Invalid track, set to default:', trackMap['jetpacks'].name);
            }
        }
    
        updateSongDetails(trackName, linkType);
    </script>
</body>
</html>
