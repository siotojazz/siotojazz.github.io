/* Starry field CSS */
.starry-field {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  overflow: hidden;
  background: #000;
}

.star-layer {
  position: absolute;
  width: 100%;
  height: 100%;
}

.star {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  opacity: 0;
  animation: twinkle 5s infinite ease-in-out;
}

.star-layer:nth-child(1) .star {
  width: 1px;
  height: 1px;
  animation-duration: 3s;
}

.star-layer:nth-child(2) .star {
  width: 2px;
  height: 2px;
  animation-duration: 4s;
  animation-delay: -1s;
}

.star-layer:nth-child(3) .star {
  width: 3px;
  height: 3px;
  animation-duration: 5s;
  animation-delay: -2s;
}

@keyframes twinkle {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.8; }
}

.comet {
  position: absolute;
  width: 3px;
  height: 3px MHD;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 25px rgba(255, 255, 255, 0.6);
  animation: comet 8s ease-in-out infinite;
  z-index: 0;
  --tail-length: 50px;
  --hue: 0;
  background: hsl(var(--hue), 100%, 100%);
  box-shadow: 0 0 15px hsl(var(--hue), 100%, 90%), 0 0 25px hsl(var(--hue), 100%, 60%);
}

.comet::after {
  content: '';
  position: absolute;
  width: 50px; /* Length of the tail */
  height: 2px;
  background: linear-gradient(to left, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0));
  transform: rotate(45deg); /* Align tail with initial movement direction */
  top: 50%;
  left: 100%;
  transform-origin: left center;
  z-index: -1;
  width: var(--tail-length);
  background: linear-gradient(to left, hsl(var(--hue), 100%, 90%), transparent);
}

@keyframes comet {
  0% {
    transform: translate(100vw, -100vh) rotate(0deg);
    opacity: 0.9;
  }
  25% {
    transform: translate(50vw, -20vh) rotate(10deg); /* Curve upward slightly */
    opacity: 0.8;
  }
  50% {
    transform: translate(0vw, 0vh) rotate(0deg); /* Peak of the curve */
    opacity: 0.7;
  }
  75% {
    transform: translate(-50vw, 20vh) rotate(-10deg); /* Curve downward */
    opacity: 0.5;
  }
  100% {
    transform: translate(-100vw, 100vh) rotate(0deg);
    opacity: 0;
  }
}

// Initialize analyser
analyser.fftSize = 64;
gainNode.gain.value = 1.0;

// Generate stars dynamically

starLayers.forEach((layer, index) => {
  const starCount = index === 0 ? 100 : index === 1 ? 50 : 30;

// Replace the comet generation code with the following
const starryField = document.querySelector('.starry-field');
for (let i = 0; i < 5; i++) {

// Function to show button action message

  setTimeout(() => messageElement.classList.remove('visible'), 2000);

function formatTime(seconds) {
  if (!isFinite(seconds)) return "00:00";
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function updateProgressBar(audio, progressBar) {
  if (!audio || !isFinite(audio.duration)) {
    progressBar.style.width = '0%';
    document.getElementById('song-times').textContent = "";

  }
  const percent = (audio.currentTime / audio.duration) * 100;
  progressBar.style.width = `${percent}%`;
  document.getElementById('song-times').textContent = `[${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}]`;
}

function updateTitleBar(trackTitle = '') {

function formatChordShape(shape) {
  const strings = ['e', 'B', 'G', 'D', 'A', 'E'];
  const frets = shape.split('').map(f => f === 'x' ? 'x' : parseInt(f));
  const maxFret = Math.max(...frets.filter(f => f !== 'x'));
  const fretCount = maxFret > 4 ? maxFret + 1 : 5;

  let diagram = [`   ${Array(fretCount).fill().map((_, i) => (i).toString().padStart(2, '0')).join(' ')}`];
  strings.forEach((string, i) => {
    let row = `${string} |`;
    const fretValue = frets[5 - i];
    for (let fret = 0; fret < fretCount; fret++) {
      row += fretValue === 'x' && fret === 0 ? 'x  ' : parseInt(fretValue) === fret ? '●  ' : '   ';
    }
    diagram.push(row);
  });
  return diagram.join('\n');
}

function formatStructure(structure, chordTimings, track) {
  if (!structure || !structure.sections || structure.sections.length === 0) {
    return '<div class="lyrics-meta-structure"><i class="fas fa-sitemap"></i>No structure available</div>';
  }

  const tempo = parseFloat(track.tempo) || 120;
  const timeSignature = track.timeSignature || "4/4";
  const beatsPerBar = parseInt(timeSignature.split('/')[0]) || 4;
  const secondsPerBeat = 60 / tempo;
  const secondsPerBar = secondsPerBeat * beatsPerBar;
  const beatsPerGroup = 8;
  const barsPerSuperGroup = 4;
  const beatsPerSuperGroup = barsPerSuperGroup * beatsPerBar;
  const boundaryTolerance = secondsPerBeat * 0.25;

  let minRepeat = Infinity;
  let maxRepeat = -Infinity;
  structure.sections.forEach(section => {
    let i = 0;
    while (i < section.chords.length) {
      let chord = section.chords[i];
      let beatCount = 1;
      let j = i + 1;
      while (j < section.chords.length && section.chords[j] === chord) {
        beatCount++;
        j++;
      }
      minRepeat = Math.min(minRepeat, beatCount);
      maxRepeat = Math.max(maxRepeat, beatCount);
      i = j;
    }
  });

  const minMultiplier = 1;
  const maxMultiplier = 4;
  function mapRepeatCount(repeatCount) {
    if (minRepeat === maxRepeat) return minMultiplier;
    return ((repeatCount - minRepeat) / (maxRepeat - minRepeat)) * (maxMultiplier - minMultiplier) + minMultiplier;
  }

  const sections = structure.sections.map((section, sectionIndex) => {
    const sectionChords = chordTimings.filter(t => t.sectionIndex === sectionIndex);
    if (sectionChords.length === 0) {
      return `
        <div class="lyrics-meta-structure-section">${section.label}</div>
        <div class="lyrics-meta-structure-content">
          <div class="chord-group">No chords</div>
        </div>
      `;
    }

    const sectionStartTime = Math.min(...sectionChords.map(t => t.startTime));
    const groupedChords = [];
    let chordIndex = 0;
    let i = 0;
    while (i < section.chords.length) {
      let chord = section.chords[i];
      let beatCount = 1;
      let j = i + 1;
      while (j < section.chords.length && section.chords[j] === chord) {
        beatCount++;
        j++;
      }
      const timing = sectionChords.find(t => t.sectionIndex === sectionIndex && t.originalChordIndex === i);
      if (timing) {
        const relativeStartTime = timing.startTime - sectionStartTime;
        let startBeat = Math.floor(relativeStartTime / secondsPerBeat) + 1;
        const exactBeat = relativeStartTime / secondsPerBeat;
        if (exactBeat % 1 >= 1 - (boundaryTolerance / secondsPerBeat)) {
          startBeat = Math.ceil(exactBeat) + 1;
        }
        groupedChords.push({ chord, timing, chordIndex, repeatCount: beatCount, startBeat });
        chordIndex++;
      }
      i = j;
    }

    const superGroups = {};
    groupedChords.forEach(({ chord, timing, chordIndex, repeatCount, startBeat }, idx) => {
      let superGroupIndex = Math.floor((startBeat - 1) / beatsPerSuperGroup);
      if (idx === groupedChords.length - 1 && superGroupIndex > 0) {
        const prevGroupChords = groupedChords.filter(c => Math.floor((c.startBeat - 1) / beatsPerSuperGroup) === superGroupIndex - 1);
        if (prevGroupChords.length > 0) {
          const lastChordTime = timing.startTime;
          const prevGroupEndTime = Math.max(...prevGroupChords.map(c => c.timing.endTime));
          if (lastChordTime - prevGroupEndTime <= boundaryTolerance) {
            superGroupIndex--;
          }
        }
      }
      if (!superGroups[superGroupIndex]) superGroups[superGroupIndex] = [];
      superGroups[superGroupIndex].push({ chord, timing, chordIndex, repeatCount, startBeat });
    });

    const superGroupHtml = Object.keys(superGroups)
      .sort((a, b) => a - b)
      .map(superGroupIndex => {
        const chords = superGroups[superGroupIndex];
        const chordGroups = [];
        let currentGroup = [];
        let currentBeatCount = 0;
        chords.forEach(chordInfo => {
          const beatsInChord = chordInfo.repeatCount;
          if (currentBeatCount + beatsInChord > beatsPerGroup) {
            if (currentGroup.length > 0) {
              chordGroups.push(currentGroup);
              currentGroup = [];
              currentBeatCount = 0;
            }
          }
          currentGroup.push(chordInfo);
          currentBeatCount += beatsInChord;
          if (currentBeatCount >= beatsPerGroup || chordInfo === chords[chords.length - 1]) {
            chordGroups.push(currentGroup);
            currentGroup = [];
            currentBeatCount = 0;
          }
        });
        if (currentGroup.length > 0) chordGroups.push(currentGroup);

        const chordGroupsHtml = chordGroups.map(group => {
          const chordBlocks = group.map(({ chord, timing, chordIndex, repeatCount }) => {
            const chordId = `chord-${sectionIndex}-${chordIndex}`;
            const widthMultiplier = mapRepeatCount(repeatCount);
            return `
              <div class="chord-block" data-chord-id="${chordId}" data-section-index="${sectionIndex}" data-chord-index="${chordIndex}" data-start-time="${timing.startTime}" data-end-time="${timing.endTime}" style="--repeat-count: ${widthMultiplier};">
                ${chord}
                <div class="chord-progress"></div>
              </div>`;
          }).join('');
          return `<div class="chord-group">${chordBlocks}</div>`;
        }).join('');

        return `<div class="lyrics-meta-structure-content">${chordGroupsHtml}</div>`;
      }).join('');

    return `
      <div class="lyrics-meta-structure-section">${section.label}</div>
      ${superGroupHtml}
    `;
  });

  return `
    <div class="structure-title">Song Structure</div>
    <div class="lyrics-meta-structure">
      ${sections.join('')}
    </div>
  `;
}

function calculateTimings(track) {
  const timings = { lyrics: [], chords: [] };
  const tempo = parseFloat(track.tempo) || 120;
  const timeSignature = track.timeSignature || "4/4";
  const beatsPerBar = parseInt(timeSignature.split('/')[0]) || 4;
  const secondsPerBeat = 60 / tempo;
  const secondsPerBar = secondsPerBeat * beatsPerBar;

  track.lyrics.forEach((lyric, index) => {
    if (lyric.barNumber !== null && lyric.barLength !== null && lyric.offset !== null) {
      const startTime = lyric.barNumber * secondsPerBar + lyric.offset * secondsPerBeat;
      const endTime = startTime + lyric.barLength * secondsPerBar;
      timings.lyrics.push({ startTime, endTime, line: lyric.line, index });
    }
  });

  let globalBeat = 0;
  track.structure.sections.forEach((section, sectionIndex) => {
    let chordIndex = 0;
    let i = 0;
    while (i < section.chords.length) {
      let chord = section.chords[i];
      let beatCount = 1;
      let j = i + 1;
      while (j < section.chords.length && section.chords[j] === chord) {
        beatCount++;
        j++;
      }
      const startTime = globalBeat * secondsPerBeat;
      const endTime = startTime + beatCount * secondsPerBeat;
      timings.chords.push({ sectionIndex, chordIndex, originalChordIndex: i, chord, startTime, endTime });
      globalBeat += beatCount;
      chordIndex++;
      i = j;
    }
  });

  track.timings = timings;
  return timings;
}

function updateLyricAndChordHighlight(audio, timings) {
  if (!audio || audio.paused || !timings) {
    const currentLyricElement = document.getElementById('current-lyric');
    const currentChordElement = document.getElementById('current-chord');
    currentLyricElement.textContent = '';
    currentLyricElement.classList.remove('visible');
    currentChordElement.textContent = '';
    currentChordElement.classList.remove('visible');
    document.querySelectorAll('.lyric-line.active, .chord-block.active, .lyric-line.past, .chord-block.past').forEach(el => {
      el.classList.remove('active', 'past');
    });
    document.querySelectorAll('.chord-progress').forEach(progress => {
      progress.style.width = '0%';
    });
    currentLyricIndex = -1;
    currentChordIndex = -1;
    return;
  }

  const currentTime = audio.currentTime;

  let newLyricIndex = -1;
  for (let i = timings.lyrics.length - 1; i >= 0; i--) {
    if (currentTime >= timings.lyrics[i].startTime && currentTime < timings.lyrics[i].endTime) {
      newLyricIndex = i;
      break;
    }
  }

  const lyricLines = document.querySelectorAll('.lyric-line');
  lyricLines.forEach(line => {
    const lineIndex = parseInt(line.getAttribute('data-index'));
    const timing = timings.lyrics[lineIndex];
    line.classList.remove('active', 'past');
    if (timing && currentTime >= timing.endTime) {
      line.classList.add('past');
    } else if (lineIndex === newLyricIndex) {
      line.classList.add('active');
    }
  });

  const currentLyricElement = document.getElementById('current-lyric');
  if (newLyricIndex >= 0 && currentLyricIndex !== newLyricIndex) {
    currentLyricElement.textContent = timings.lyrics[newLyricIndex].line;
    currentLyricElement.classList.add('visible');
  } else if (newLyricIndex < 0) {
    currentLyricElement.textContent = '';
    currentLyricElement.classList.remove('visible');
  }
  currentLyricIndex = newLyricIndex;

  let newChordIndex = -1;
  for (let i = timings.chords.length - 1; i >= 0; i--) {
    if (currentTime >= timings.chords[i].startTime && currentTime < timings.chords[i].endTime) {
      newChordIndex = i;
      break;
    }
  }

  document.querySelectorAll('.chord-block').forEach(block => {
    block.classList.remove('past', 'active');
    block.querySelector('.chord-progress').style.width = '0%';
  });

  timings.chords.forEach((timing, i) => {
    const chordBlock = document.querySelector(`.chord-block[data-chord-id="chord-${timing.sectionIndex}-${timing.chordIndex}"]`);
    if (chordBlock) {
      if (currentTime >= timing.endTime) {
        chordBlock.classList.add('past');
        chordBlock.querySelector('.chord-progress').style.width = '100%';
      } else if (i === newChordIndex) {
        chordBlock.classList.add('active');
        const chordDuration = timing.endTime - timing.startTime;
        const progress = (currentTime - timing.startTime) / chordDuration;
        const progressPercent = Math.min(Math.max(progress * 100, 0), 100);
        chordBlock.querySelector('.chord-progress').style.width = `${progressPercent}%`;
      }
    }
  });

  const currentChordElement = document.getElementById('current-chord');
  if (newChordIndex >= 0 && currentChordIndex !== newChordIndex) {
    currentChordElement.textContent = timings.chords[newChordIndex].chord;
    currentChordElement.classList.add('visible');
  } else if (newChordIndex < 0) {
    currentChordElement.textContent = '';
    currentChordElement.classList.remove('visible');
  }
  currentChordIndex = newChordIndex;
}

async function setupAudioRouting(audio) {
  if (currentSource) {
    try {
      currentSource.disconnect();
    } catch (error) {
      console.error('Error disconnecting previous source:', error);
    }
  }
  try {
    if (audioContext.state === 'suspended') {
      await audioContext.resume();
    }
    currentSource = audioContext.createMediaElementSource(audio);
    currentSource.connect(gainNode);
    gainNode.connect(analyser);
    analyser.connect(audioContext.destination);
    gainNode.gain.value = document.getElementById('volume-slider').value / 100;
    return true;
  } catch (error) {
    console.error('Audio routing setup failed:', error);
    return false;
  }
}

async function playTrack(index) {
  if (index < 0 || index >= tracks.length) {
    console.warn('Invalid track index:', index);
    showButtonMessage('Invalid Track');
    return;
  }

  const track = tracks[index];
  const tr = document.querySelector(`tr[data-id="${track.id}"]`);
  const lyricsContainer = document.getElementById('lyrics-container');
  const structureContainer = document.getElementById('structure-container');
  const globalProgress = document.getElementById('global-progress');

  // Clean up previous audio
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    if (currentSource) {
      try {
        currentSource.disconnect();
      } catch (error) {
        console.error('Error disconnecting source:', error);
      }
    }
    currentAudio.removeEventListener('timeupdate', currentAudio._timeupdateHandler);
    const lyricsContentContainer = lyricsContainer.querySelector('.lyrics-content-container');
    if (lyricsContentContainer) {
      lyricsContentContainer.removeEventListener('click', lyricsContentContainer._clickHandler);
    }
    const structureContentContainer = structureContainer.querySelector('.structure-content-container');
    if (structureContentContainer) {
      structureContentContainer.removeEventListener('click', structureContentContainer._clickHandler);
    }
  }

  const audio = document.getElementById(`audio-${track.id}`);
  if (!audio) {
    console.error(`Audio element for track ${track.id} not found`);
    tr.classList.add('track-error');
    showButtonMessage('Audio Not Found');
    return;
  }

  audio.currentTime = 0;
  let useWebAudio = audioContext.state !== 'suspended';
  if (useWebAudio) {
    useWebAudio = await setupAudioRouting(audio);
  }
  if (!useWebAudio) {
    audio.volume = document.getElementById('volume-slider').value / 100;
  }

  try {
    await audio.play();
    currentAudio = audio;
    currentTrackIndex = index;
    if (isShuffled && !playedIndices.includes(index)) playedIndices.push(index);
    updateTitleBar(track.title);
    showButtonMessage(`Playing ${track.title}`);
  } catch (error) {
    console.error(`Playback failed for track ${track.id}:`, error);
    tr.classList.add('track-error');
    showButtonMessage('Playback Failed');
    return;
  }

  const timings = calculateTimings(track);
  const lyricsHtml = track.lyrics && track.lyrics.length > 0
    ? track.lyrics.map((lyric, idx) => {
        const timing = timings.lyrics.find(t => t.index === idx);
        const startTimeAttr = timing ? ` data-start-time="${timing.startTime}"` : '';
        const stanzaClass = lyric.stanzaEnd ? ' stanza-end' : '';
        return `<div class="lyric-line${stanzaClass}" data-index="${idx}"${startTimeAttr}>${lyric.line}</div>`;
      }).join('')
    : '<div class="lyric-line">No lyrics available</div>';

  lyricsContainer.innerHTML = `
    <div class="lyrics-title">${track.title}</div>
    <div class="lyrics-content-container">
      ${lyricsHtml}
    </div>
    <div class="lyrics-meta-container">
      ${track.date ? `<div class="lyrics-meta-date"><i class="fas fa-calendar-alt"></i>${track.date}</div>` : ''}
      <div class="lyrics-meta-tempo"><i class="fas fa-tachometer-alt"></i>${track.tempo || 'N/A'} BPM</div>
      <div class="lyrics-meta-timeSignature"><i class="fas fa-sitemap"></i>${track.timeSignature || '4/4'}</div>
    </div>
  `;
  lyricsContainer.classList.add('visible');

  structureContainer.innerHTML = `
    <div class="structure-content-container">
      ${formatStructure(track.structure, timings.chords, track)}
    </div>
  `;
  structureContainer.classList.add('visible');

  const lyricsContentContainer = lyricsContainer.querySelector('.lyrics-content-container');
  lyricsContentContainer._clickHandler = async (event) => {
    const lyricLine = event.target.closest('.lyric-line');
    if (lyricLine && currentAudio && isFinite(currentAudio.duration)) {
      const startTime = parseFloat(lyricLine.getAttribute('data-start-time'));
      if (!isNaN(startTime)) {
        currentAudio.currentTime = startTime;
        updateProgressBar(currentAudio, globalProgress);
        if (currentAudio.paused) {
          let useWebAudio = currentSource && audioContext.state !== 'suspended';
          if (useWebAudio) useWebAudio = await setupAudioRouting(currentAudio);
          if (!useWebAudio) currentAudio.volume = document.getElementById('volume-slider').value / 100;
          try {
            await currentAudio.play();
            document.getElementById('play-pause-btn').querySelector('i').className = 'fas fa-pause';
            showButtonMessage('Play from Lyric');
          } catch (error) {
            console.error(`Playback failed: ${error}`);
            showButtonMessage('Playback Failed');
          }
        }
      }
    }
  };
  lyricsContentContainer.addEventListener('click', lyricsContentContainer._clickHandler);

  const structureContentContainer = structureContainer.querySelector('.structure-content-container');
  structureContentContainer._clickHandler = async (event) => {
    const chordBlock = event.target.closest('.chord-block');
    if (chordBlock && currentAudio && isFinite(currentAudio.duration)) {
      const startTime = parseFloat(chordBlock.getAttribute('data-start-time'));
      if (!isNaN(startTime)) {
        currentAudio.currentTime = startTime;
        updateProgressBar(currentAudio, globalProgress);
        if (currentAudio.paused) {
          let useWebAudio = currentSource && audioContext.state !== 'suspended';
          if (useWebAudio) useWebAudio = await setupAudioRouting(currentAudio);
          if (!useWebAudio) currentAudio.volume = document.getElementById('volume-slider').value / 100;
          try {
            await currentAudio.play();
            document.getElementById('play-pause-btn').querySelector('i').className = 'fas fa-pause';
            showButtonMessage('Play from Chord');
          } catch (error) {
            console.error(`Playback failed: ${error}`);
            showButtonMessage('Playback Failed');
          }
        }
      }
    }
  };
  structureContentContainer.addEventListener('click', structureContentContainer._clickHandler);

  audio._timeupdateHandler = () => updateProgressBar(audio, globalProgress);
  audio.addEventListener('timeupdate', audio._timeupdateHandler);
}

function stopTrack() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    if (currentSource) {
      try {
        currentSource.disconnect();
      } catch (error) {
        console.error('Error disconnecting source:', error);
      }
    }
    currentAudio.removeEventListener('timeupdate', currentAudio._timeupdateHandler);
    document.getElementById('global-progress').style.width = '0%';
    document.getElementById('song-times').textContent = "::::::::::::::::::";
    document.getElementById('current-lyric').textContent = '';
    document.getElementById('current-lyric').classList.remove('visible');
    document.getElementById('current-chord').textContent = '';
    document.getElementById('current-chord').classList.remove('visible');
    document.querySelectorAll('.lyric-line.active, .chord-block.active, .lyric-line.past, .chord-block.past').forEach(el => {
      el.classList.remove('active', 'past');
    });
    document.querySelectorAll('.chord-progress').forEach(progress => {
      progress.style.width = '0%';
    });
    currentAudio = null;
    currentSource = null;
    currentTrackIndex = -1;
    updateTitleBar();
    showButtonMessage('Stopped');
  }
}

function seekToTime(event) {
  if (currentAudio && isFinite(currentAudio.duration)) {
    const progressBar = document.querySelector('.title-bar-progress');
    const rect = progressBar.getBoundingClientRect();
    const percentage = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
    currentAudio.currentTime = percentage * currentAudio.duration;
    document.getElementById('global-progress').style.width = `${percentage * 100}%`;
    document.getElementById('song-times').textContent = `[${formatTime(currentAudio.currentTime)} / ${formatTime(currentAudio.duration)}]`;
    if (currentTrackIndex >= 0) {
      updateLyricAndChordHighlight(currentAudio, tracks[currentTrackIndex].timings);
    }
    showButtonMessage('Seeked');
  }
}

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function getNextShuffledIndex() {
  if (playedIndices.length >= tracks.length) {
    playedIndices = [currentTrackIndex];
    shuffledIndices = shuffleArray([...Array(tracks.length).keys()].filter(i => i !== currentTrackIndex));
  }
  const nextIndex = shuffledIndices.shift();
  playedIndices.push(nextIndex);
  return nextIndex;
}

function getPrevShuffledIndex() {
  if (playedIndices.length <= 1) return currentTrackIndex;
  return playedIndices[playedIndices.length - 2];
}

// Volume knob interaction
const volumeKnob = document.getElementById('volume-knob');
const volumeSlider = document.getElementById('volume-slider');
let isDragging = false;
let startAngle = 0;
let currentAngle = 0;

volumeSlider.value = 100;
updateVolumeKnob();

function updateVolumeKnob() {
  const rotation = volumeSlider.value * 2.7 - 135;
  volumeKnob.style.transform = `rotate(${rotation}deg)`;
  if (currentAudio) {
    if (currentSource && gainNode) {
      gainNode.gain.value = volumeSlider.value / 100;
    } else {
      currentAudio.volume = volumeSlider.value / 100;
    }
  }
  showButtonMessage(`Volume: ${Math.round(volumeSlider.value)}%`);
}

function handleVolumeInteractionStart(event, isTouch = false) {
  isDragging = true;
  const rect = volumeKnob.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const clientX = isTouch ? event.touches[0].clientX : event.clientX;
  const clientY = isTouch ? event.touches[0].clientY : event.clientY;
  startAngle = Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
}

function handleVolumeInteractionMove(event, isTouch = false) {
  if (!isDragging) return;
  const rect = volumeKnob.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const clientX = isTouch ? event.touches[0].clientX : event.clientX;
  const clientY = isTouch ? event.touches[0].clientY : event.clientY;
  const angle = Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
  let deltaAngle = angle - startAngle;
  if (deltaAngle > 180) deltaAngle -= 360;
  if (deltaAngle < -180) deltaAngle += 360;
  currentAngle = Math.max(-135, Math.min(135, currentAngle + deltaAngle));
  volumeSlider.value = (currentAngle + 135) / 2.7;
  startAngle = angle;
  updateVolumeKnob();
}

volumeKnob.addEventListener('mousedown', (e) => handleVolumeInteractionStart(e));
document.addEventListener('mousemove', (e) => handleVolumeInteractionMove(e));
document.addEventListener('mouseup', () => isDragging = false);

volumeKnob.addEventListener('touchstart', (e) => {
  e.preventDefault();
  handleVolumeInteractionStart(e, true);
}, { passive: false });

document.addEventListener('touchmove', (e) => {
  e.preventDefault();
  handleVolumeInteractionMove(e, true);
}, { passive: false });

document.addEventListener('touchend', () => isDragging = false);
volumeSlider.addEventListener('input', updateVolumeKnob);

// Instrument labels
function parseInstrumentLabels(labelString) {
  if (!labelString || typeof labelString !== 'string') return [];
  const instruments = ['vocals', 'sax', 'guitar1', 'guitar2', 'bass', 'drums', 'else'];
  const states = ['none', 'meh', 'great'];
  const labelEntries = labelString.split(',').map(entry => entry.trim());
  return instruments.map(instrument => {
    const entry = labelEntries.find(e => e.startsWith(instrument + '['));
    let state = 'none';
    if (entry) {
      const stateMatch = entry.match(/\[([^\]]+)\]/);
      if (stateMatch && states.includes(stateMatch[1].toLowerCase())) {
        state = stateMatch[1].toLowerCase();
      }
    }
    return { instrument, state };
  });
}

function generateInstrumentStates(labels) {
  return labels.map(({ instrument, state }) => `
    <span class="instrument-state ${instrument} ${state}">
      <i class="fas"></i>
    </span>
  `).join('');
}

  }
}

        if (durationSpan) durationSpan.textContent = formatTime(audio.duration);
        totalDuration += isFinite(audio.duration) ? audio.duration : 0;
        document.getElementById('total-time').textContent = formatTime(totalDuration);
      };

      const { icon, class: labelClass } = getLabelIcon(track.label);
      const instrumentLabels = parseInstrumentLabels(track.label);

      const tr = document.createElement('tr');

        <td class="track-number">${index + 1}</td>

        <td class="instrument-states">${instrumentStatesHtml}</td>
        <td class="track-tempo">${track.tempo || 'N/A'}</td>

      `;
      trackList.appendChild(tr);

      audio.addEventListener('ended', () => {
        document.getElementById('global-progress').style.width = '0%';
        document.getElementById('song-times').textContent = "[00:00 / 00:00]";
        if (repeatMode === 2) {
          playTrack(currentTrackIndex);
        } else if (repeatMode === 1 && currentTrackIndex === tracks.length - 1) {
          playTrack(isShuffled ? getNextShuffledIndex() : 0);
        } else if (currentTrackIndex < tracks.length - 1) {
          playTrack(isShuffled ? getNextShuffledIndex() : currentTrackIndex + 1);
        } else if (isShuffled) {
          playTrack(getNextShuffledIndex());
        }
      });

      audio.addEventListener('error', () => {
        console.warn(`Failed to load audio for ${track.mp3}`);
        tr.classList.add('track-error');
        showButtonMessage('Track Load Error');
      });
    });

    if (tracks.length > 0) {
      currentTrackIndex = isShuffled ? getNextShuffledIndex() : 0;
      updateTitleBar(tracks[currentTrackIndex].title);
      const firstTrackRow = document.querySelector(`tr[data-id="${tracks[currentTrackIndex].id}"]`);
      if (firstTrackRow) firstTrackRow.classList.add('now-playing');
    }

    trackList.addEventListener('click', (event) => {
      const tr = event.target.closest('tr.track');
      if (tr) {
        const trackId = tr.getAttribute('data-id');
        const trackIndex = tracks.findIndex(t => t.id === parseInt(trackId));
        if (trackIndex >= 0) {
          currentTrackIndex = trackIndex;
          if (isShuffled && !playedIndices.includes(trackIndex)) playedIndices.push(trackIndex);
          playTrack(trackIndex);
        }
      }
    });

    document.addEventListener('mouseover', (event) => {
      const chordBlock = event.target.closest('.chord-block');
      if (chordBlock) {
        let chordName = '';
        for (let node of chordBlock.childNodes) {
          if (node.nodeType === Node.TEXT_NODE) {
            chordName = node.textContent.trim();
            break;
          }
        }
        if (!chordName) return;

        const chordShape = chordData[chordName] || 'Unknown';
        let tooltipContent = chordShape !== 'Unknown'
          ? `
            <div class="chord-tooltip-content">
              <div>${chordName}</div>
              <div class="chord-tooltip-fretboard">${formatChordShape(chordShape)}</div>
            </div>
          `
          : `
            <div class="chord-tooltip-content">
              <div>${chordName}</div>
              <div class="chord-tooltip-fretboard">No chord shape available</div>
            </div>
          `;

        let tooltip = document.querySelector('.chord-tooltip');
        if (!tooltip) {
          tooltip = document.createElement('div');
          tooltip.className = 'chord-tooltip';
          document.body.appendChild(tooltip);
        }
        tooltip.innerHTML = tooltipContent;
        const rect = chordBlock.getBoundingClientRect();
        tooltip.style.left = `${rect.left + window.scrollX}px`;
        tooltip.style.top = `${rect.bottom + window.scrollY + 5}px`;
        tooltip.classList.add('visible');
      }
    });

    document.addEventListener('mouseout', (event) => {
      const chordBlock = event.target.closest('.chord-block');
      if (chordBlock) {
        const tooltip = document.querySelector('.chord-tooltip');
        if (tooltip) tooltip.classList.remove('visible');
      }
    });

    document.getElementById('prev-btn').addEventListener('click', () => {
      if (repeatMode === 2) {
        playTrack(currentTrackIndex);
        showButtonMessage('Repeat Song');
      } else if (currentTrackIndex > 0) {
        const prevIndex = isShuffled ? getPrevShuffledIndex() : currentTrackIndex - 1;
        playTrack(prevIndex);
        showButtonMessage('Previous Track');
      } else if (repeatMode === 1) {
        const lastIndex = isShuffled ? getNextShuffledIndex() : tracks.length - 1;
        playTrack(lastIndex);
        showButtonMessage('Previous Track');
      }
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      if (repeatMode === 2) {
        playTrack(currentTrackIndex);
        showButtonMessage('Repeat Song');
      } else if (currentTrackIndex < tracks.length - 1) {
        const nextIndex = isShuffled ? getNextShuffledIndex() : currentTrackIndex + 1;
        playTrack(nextIndex);
        showButtonMessage('Next Track');
      } else if (repeatMode === 1) {
        playTrack(isShuffled ? getNextShuffledIndex() : 0);
        showButtonMessage('Next Track');
      }
    });

    document.getElementById('play-pause-btn').addEventListener('click', async () => {
      if (audioContext.state === 'suspended') {
        try {
          await audioContext.resume();
        } catch (error) {
          console.error('Error resuming AudioContext:', error);
          showButtonMessage('AudioContext Error');
        }
      }

      if (currentAudio) {
        if (currentAudio.paused) {
          let useWebAudio = currentSource && audioContext.state !== 'suspended';
          if (useWebAudio) useWebAudio = await setupAudioRouting(currentAudio);
          if (!useWebAudio) currentAudio.volume = document.getElementById('volume-slider').value / 100;
          try {
            await currentAudio.play();
            document.getElementById('play-pause-btn').querySelector('i').className = 'fas fa-pause';
            showButtonMessage('Play');
          } catch (error) {
            console.error(`Playback failed: ${error}`);
            showButtonMessage('Playback Failed');
          }
        } else {
          currentAudio.pause();
          document.getElementById('play-pause-btn').querySelector('i').className = 'fas fa-play';
          updateProgressBar(currentAudio, document.getElementById('global-progress'));
          showButtonMessage('Pause');
        }
      } else if (tracks.length > 0) {
        const startIndex = isShuffled ? getNextShuffledIndex() : 0;
        playTrack(startIndex);
      }
    });

    document.getElementById('stop-btn').addEventListener('click', () => stopTrack());

    document.getElementById('repeat-btn').addEventListener('click', () => {
      repeatMode = (repeatMode + 1) % 3;
      const repeatBtn = document.getElementById('repeat-btn');
      const icon = repeatBtn.querySelector('i');
      switch (repeatMode) {
        case 0:
          repeatBtn.classList.remove('repeat-playlist', 'repeat-song');
          icon.className = 'fas fa-undo-alt';
          showButtonMessage('Repeat Off');
          break;
        case 1:
          repeatBtn.classList.remove('repeat-song');
          repeatBtn.classList.add('repeat-playlist');
          icon.className = 'fas fa-sync-alt';
          showButtonMessage('Repeat Playlist');
          break;
        case 2:
          repeatBtn.classList.remove('repeat-playlist');
          repeatBtn.classList.add('repeat-song');
          icon.className = 'fas fa-redo';
          showButtonMessage('Repeat Song');
          break;
      }
    });

    document.getElementById('shuffle-btn').addEventListener('click', () => {
      isShuffled = !isShuffled;
      if (isShuffled) {
        shuffledIndices = shuffleArray([...Array(tracks.length).keys()]);
        playedIndices = currentTrackIndex >= 0 ? [currentTrackIndex] : [];
        document.getElementById('shuffle-btn').classList.add('active');
        showButtonMessage('Shuffle On');
      } else {
        playedIndices = [];
        shuffledIndices = [];
        document.getElementById('shuffle-btn').classList.remove('active');
        showButtonMessage('Shuffle Off');
      }
    });

    // Define sections and their corresponding buttons
    const sections = [
      { element: document.getElementById('album-display'), button: document.getElementById('album-btn'), showMessage: 'Album Cover Shown', hideMessage: 'Album Cover Hidden' },
      { element: document.getElementById('tracklist'), button: document.getElementById('tracks-btn'), showMessage: 'Tracks Shown', hideMessage: 'Tracks Hidden' },
      { element: document.getElementById('lyrics-section'), button: document.getElementById('lyrics-btn'), showMessage: 'Lyrics Shown', hideMessage: 'Lyrics Hidden' },
      { element: document.getElementById('structure-section'), button: document.getElementById('structure-btn'), showMessage: 'Structure Shown', hideMessage: 'Structure Hidden' }
    ];

    function toggleSection(selectedSection, selectedButton, showMessage, hideMessage) {
      const isAlreadyVisible = selectedSection.classList.contains('visible');
      sections.forEach(({ element, button, hideMessage: sectionHideMessage }) => {
        if (element.classList.contains('visible')) {
          element.classList.remove('visible');
          element.addEventListener('transitionend', function handler(event) {
            if (event.propertyName === 'max-height') {
              element.style.display = 'none';
              element.removeEventListener('transitionend', handler);
            }
          }, { once: true });
          button.classList.remove('active');
          showButtonMessage(sectionHideMessage);
        }
      });

      if (isAlreadyVisible) {
        showButtonMessage(hideMessage);
        selectedButton.classList.remove('active');
        return;
      }

      selectedSection.style.display = selectedSection.classList.contains('album-display') ? 'flex' : 'block';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          selectedSection.classList.add('visible');
          selectedButton.classList.add('active');
          showButtonMessage(showMessage);
        });
      });
    }

    sections.forEach(({ element, button, showMessage, hideMessage }) => {
      button.addEventListener('click', () => toggleSection(element, button, showMessage, hideMessage));
    });

    sections.forEach(({ element }) => {
      element.style.display = 'none';
    });

    document.querySelector('.title-bar-progress').addEventListener('click', seekToTime);
  })
  .catch(error => {
    console.error('Error loading album data:', error);
    showButtonMessage('Failed to Load Album');
  });</script>
</body>
</html>
