<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiotoJazz - 29</title>
    <style>
        @font-face {
            font-family: 'Astrella';
            src: url('../fonts/Astrella.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'MS Sans Serif', Arial, sans-serif;
            background: #008080;
            color: #000;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-text-size-adjust: 100%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: linear-gradient(to right, #000080, #1084d0);
            border: 2px outset #fff;
            box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #000;
            margin: 0;
            width: 100%;
            max-width: 600px;
        }
        header .title-container {
            display: flex;
            flex-direction: column;
            padding: 4px 8px;
        }
        header h1 {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            margin-bottom: 4px;
            font-family: Garet, sans-serif;
        }
        header p {
            font-size: 18px;
            color: #dfdfdf;
            text-shadow: 1px 1px 0 #000;
            font-family: 'Astrella', cursive;
            text-transform: uppercase;
            line-height: 22px;
        }
        header img {
            max-width: 80px;
            border: 1px solid #000;
            box-shadow: 2px 2px 0 #000;
        }
        .song-list {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 0;
            margin: 0;
        }
        .song-item {
            flex: 1 1 calc(33.33%);
            padding: 0;
            background: #c0c0c0;
            border: 2px outset #fff;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            line-height: 24px;
        }
        .song-item:hover {
            background: #d3d3d3;
        }
        .song-item.active {
            background: #000080;
            color: #fff;
            border: 2px inset #fff;
        }
        .player {
            max-width: 600px;
            width: 100%;
            padding: 8px;
            background: #c0c0c0;
            border: 2px outset #fff;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: nowrap;
        }
        .player-controls button {
            padding: 4px 8px;
            background: #c0c0c0;
            border: 2px outset #fff;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 24px;
            line-height: 1;
        }
        .player-controls button:disabled {
            color: #808080;
            border: 2px inset #fff;
            cursor: default;
        }
        .player-controls button .icon {
            font-size: 14px;
            line-height: 1;
        }
        .player-timeline {
            font-size: 12px;
            flex-grow: 1;
            text-align: right;
            padding-right: 8px;
        }
        .seek-bar-container {
            width: 100%;
            margin: 6px 0;
            border: 2px inset #c0c0c0;
            background: #c0c0c0;
        }
        .seek-bar {
            width: 100%;
            height: 12px;
            -webkit-appearance: none;
            appearance: none;
            background: #c0c0c0;
            border: none;
            outline: none;
            cursor: pointer;
        }
        .seek-bar::-webkit-slider-runnable-track {
            height: 12px;
            background: #c0c0c0;
        }
        .seek-bar::-moz-range-track {
            height: 12px;
            background: #c0c0c0;
        }
        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 0;
            height: 0;
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
        .seek-bar::-moz-range-thumb {
            width: 0;
            height: 0;
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
        .seek-bar::-ms-thumb {
            width: 0;
            height: 0;
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
        .seek-bar[value]::-webkit-slider-runnable-track {
            background: linear-gradient(
                to right,
                repeating-linear-gradient(
                    to right,
                    #000080 0%,
                    #000080 8px,
                    #c0c0c0 8px,
                    #c0c0c0 10px
                ) 0% / calc(var(--value) * 1%) 100% no-repeat,
                #c0c0c0
            );
        }
        .seek-bar[value]::-moz-range-progress {
            height: 12px;
            background: repeating-linear-gradient(
                to right,
                #000080 0%,
                #000080 8px,
                #c0c0c0 8px,
                #c0c0c0 10px
            );
        }
        .seek-bar::-ms-fill-lower {
            background: repeating-linear-gradient(
                to right,
                #000080 0%,
                #000080 8px,
                #c0c0c0 8px,
                #c0c0c0 10px
            );
        }
        .seek-bar::-ms-fill-upper {
            background: #c0c0c0;
        }
        .content-container {
            display: flex;
            gap: 8px;
        }
        .lyrics, .structure {
            flex: 1;
            padding: 6px;
            background: #fff;
            border: 2px inset #c0c0c0;
            font-size: 12px;
        }
        .lyrics h4, .structure h4 {
            font-size: 12px;
            color: #000;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .lyrics-line, .structure-block {
            margin: 2px 0;
            cursor: pointer;
        }
        .lyrics-line.active {
            background: #000080;
            color: #fff;
        }
        .structure-chord {
            display: block;
            background: #d3d3d3;
            padding: 2px 4px;
            font-size: 11px;
            cursor: pointer;
            position: relative;
            border: 2px outset #fff;
        }
        .structure-chord.active {
            background: #000080;
            color: #fff;
            border: 2px inset #c0c0c0;
            box-shadow: inset 2px 2px 3px #000, inset -2px -2px 3px #808080;
            padding: 2px 4px;
        }
        .stanza-end {
            margin-bottom: 12px;
        }
        .structure-block {
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .chord-container {
            flex: 1;
            text-align: center;
        }
        .chord:hover .chord-value {
            display: block;
        }
        .chord-value {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 2px 4px;
            font-size: 10px;
            z-index: 10;
            border: 1px solid #fff;
        }
        .chord-progress {
            width: 100%;
            height: 6px;
            background: #c0c0c0;
            border: 1px inset #fff;
            margin-top: 2px;
            position: relative;
            overflow: hidden;
        }
        .chord-progress::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: calc(var(--progress, 0) * 1%);
            background: repeating-linear-gradient(
                to right,
                #000080 0%,
                #000080 8px,
                #c0c0c0 8px,
                #c0c0c0 10px
            );
            transition: width 0.01s linear;
        }
        audio {
            display: none;
        }
        @media (max-width: 600px) {
            body {
                padding: 4px;
            }
            header {
                padding: 4px;
                max-width: 100%;
            }
            header h1 {
                font-size: 14px;
            }
            header p {
                font-size: 12px;
                line-height: 16px;
            }
            header img {
                max-width: 50px;
            }
            .song-list {
                max-width: 100%;
            }
            .song-item {
                flex: 1 1 100%; /* Single column */
                font-size: 10px;
                line-height: 18px;
                padding: 5px 0;
            }
            .player {
                max-width: 100%;
                padding: 4px;
            }
            .player-controls {
                gap: 4px;
            }
            .player-controls button {
                width: 32px;
                height: 20px;
                padding: 3px 5px;
            }
            .player-controls button .icon {
                font-size: 11px;
            }
            .player-timeline {
                font-size: 10px;
                padding-right: 4px;
            }
            .seek-bar-container {
                margin: 4px 0;
            }
            .seek-bar {
                height: 8px;
            }
            .seek-bar::-webkit-slider-runnable-track,
            .seek-bar::-moz-range-track {
                height: 8px;
            }
            .seek-bar[value]::-webkit-slider-runnable-track {
                background: linear-gradient(
                    to right,
                    repeating-linear-gradient(
                        to right,
                        #000080 0%,
                        #000080 5px,
                        #c0c0c0 5px,
                        #c0c0c0 6px
                    ) 0% / calc(var(--value) * 1%) 100% no-repeat,
                    #c0c0c0
                );
            }
            .seek-bar[value]::-moz-range-progress {
                height: 8px;
                background: repeating-linear-gradient(
                    to right,
                    #000080 0%,
                    #000080 5px,
                    #c0c0c0 5px,
                    #c0c0c0 6px
                );
            }
            .seek-bar::-ms-fill-lower {
                background: repeating-linear-gradient(
                    to right,
                    #000080 0%,
                    #000080 5px,
                    #c0c0c0 5px,
                    #c0c0c0 6px
                );
            }
            .content-container {
                flex-direction: column;
                gap: 6px;
            }
            .lyrics, .structure {
                padding: 3px;
                font-size: 9px;
            }
            .lyrics h4, .structure h4 {
                font-size: 10px;
                margin-bottom: 2px;
            }
            .structure-chord {
                font-size: 9px;
                padding: 1px 2px;
            }
            .chord-value {
                font-size: 8px;
                padding: 1px 2px;
            }
            .chord-progress {
                height: 4px;
            }
        }
        @media (max-width: 400px) {
            .song-item {
                font-size: 9px;
                line-height: 16px;
            }
            .player-controls button {
                width: 30px;
                height: 18px;
            }
            .player-controls button .icon {
                font-size: 10px;
            }
            .player-timeline {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="title-container">
            <h1 id="album-title"></h1>
            <p><span id="album-band"></span></p>
        </div>
        <img id="album-cover" src="album_cover.png" alt="Album Cover">
    </header>

    <section class="song-list" id="song-list"></section>
    <section class="player" id="player">
        <div class="player-controls">
            <button class="play-btn" disabled aria-label="Play audio"><span class="icon">▶</span></button>
            <button class="pause-btn" disabled aria-label="Pause audio"><span class="icon">⏸</span></button>
            <span class="player-timeline">0:00 / 0:00</span>
        </div>
        <div class="seek-bar-container">
            <input type="range" class="seek-bar" min="0" max="100" value="0" style="--value: 0;">
        </div>
        <audio id="audio-player"></audio>
        <div class="content-container">
            <div class="lyrics">
                <h4>Lyrics</h4>
                <div class="lyrics-content"></div>
            </div>
            <div class="structure">
                <h4>Structure</h4>
                <div class="structure-content"></div>
            </div>
        </div>
    </section>

    <script>
        fetch('album.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('album-title').textContent = data.album.title;
                document.getElementById('album-band').textContent = data.album.band;

                const chordMap = new Map(data.chords.map(chordObj => {
                    const chordName = Object.keys(chordObj)[0];
                    return [chordName, chordObj[chordName]];
                }));

                const songList = document.getElementById('song-list');
                const player = document.getElementById('player');
                const audio = document.getElementById('audio-player');
                const playBtn = player.querySelector('.play-btn');
                const pauseBtn = player.querySelector('.pause-btn');
                const timeline = player.querySelector('.player-timeline');
                const seekBar = player.querySelector('.seek-bar');
                const lyricsContent = player.querySelector('.lyrics-content');
                const structureContent = player.querySelector('.structure-content');
                let currentTrack = null;
                let lastUpdateTime = 0;

                seekBar.addEventListener('input', () => {
                    seekBar.style.setProperty('--value', seekBar.value);
                    if (currentTrack) {
                        const duration = audio.duration || 0;
                        audio.currentTime = (seekBar.value / 100) * duration;
                    }
                });

                data.tracks.forEach(track => {
                    const songItem = document.createElement('div');
                    songItem.className = 'song-item';
                    songItem.textContent = track.title;
                    songItem.addEventListener('click', () => {
                        if (currentTrack) {
                            audio.pause();
                            audio.currentTime = 0;
                        }
                        document.querySelectorAll('.song-item').forEach(item => item.classList.remove('active'));
                        songItem.classList.add('active');
                        playBtn.disabled = true;
                        pauseBtn.disabled = false;

                        audio.src = track.mp3;
                        if (!audio.src) {
                            console.error('Invalid audio source for track:', track.title);
                            return;
                        }
                        lyricsContent.innerHTML = '';
                        structureContent.innerHTML = '';
                        currentTrack = track;

                        track.lyrics.forEach((line, index) => {
                            const lineDiv = document.createElement('div');
                            lineDiv.className = 'lyrics-line';
                            lineDiv.dataset.index = index;
                            lineDiv.dataset.bar = line.barNumber || 1;
                            lineDiv.dataset.length = line.barLength || 1;
                            if (line.stanzaEnd) lineDiv.classList.add('stanza-end');
                            lineDiv.textContent = line.line || ' ';
                            lineDiv.addEventListener('click', () => {
                                if (currentTrack === track) {
                                    const bpm = parseInt(track.tempo) || 120;
                                    const beatDuration = 60 / bpm;
                                    const bar = parseInt(lineDiv.dataset.bar) || 1;
                                    const beatsPerBar = track.timeSignature === '4/4' ? 4 : 6;
                                    const startTime = bar * (beatDuration * beatsPerBar);
                                    audio.currentTime = startTime;
                                    audio.play().catch(err => console.error('Audio play error:', err));
                                    playBtn.disabled = true;
                                    pauseBtn.disabled = false;
                                }
                            });
                            lyricsContent.appendChild(lineDiv);
                        });

                        let beatIndex = 0;
                        track.structure.sections.forEach(section => {
                            for (let i = 0; i < section.chords.length; i += 8) {
                                const blockChords = section.chords.slice(i, i + 8);
                                const blockDiv = document.createElement('div');
                                blockDiv.className = 'structure-block';
                                blockDiv.dataset.bar = i / 4 + 1;

                                for (let barOffset = 0; barOffset < blockChords.length; barOffset += 4) {
                                    const barChords = blockChords.slice(barOffset, barOffset + 4);
                                    let j = 0;
                                    while (j < barChords.length) {
                                        let chord = barChords[j];
                                        let chordSpanLength = 1;
                                        while (j + chordSpanLength < barChords.length && barChords[j + chordSpanLength] === chord) {
                                            chordSpanLength++;
                                        }

                                        const chordContainer = document.createElement('div');
                                        chordContainer.className = 'chord-container';
                                        chordContainer.style.flex = chordSpanLength;
                                        const chordSpan = document.createElement('span');
                                        chordSpan.className = 'structure-chord';
                                        chordSpan.dataset.beat = beatIndex + 1;
                                        chordSpan.dataset.span = chordSpanLength;
                                        chordSpan.innerHTML = `<span class="chord">${chord || 'N/A'}<span class="chord-value">${chordMap.get(chord) || 'N/A'}</span></span>`;
                                        const progressDiv = document.createElement('div');
                                        progressDiv.className = 'chord-progress';
                                        progressDiv.dataset.beat = beatIndex + 1;
                                        progressDiv.dataset.span = chordSpanLength;

                                        chordSpan.addEventListener('click', () => {
                                            if (currentTrack === track) {
                                                const bpm = parseInt(track.tempo) || 120;
                                                const beatDuration = 60 / bpm;
                                                const beat = parseInt(chordSpan.dataset.beat);
                                                const startTime = (beat - 1) * beatDuration;
                                                audio.currentTime = startTime;
                                                audio.play().catch(err => console.error('Audio play error:', err));
                                                playBtn.disabled = true;
                                                pauseBtn.disabled = false;
                                            }
                                        });

                                        chordContainer.appendChild(chordSpan);
                                        chordContainer.appendChild(progressDiv);
                                        blockDiv.appendChild(chordContainer);

                                        beatIndex += chordSpanLength;
                                        j += chordSpanLength;
                                    }
                                }
                                structureContent.appendChild(blockDiv);
                            }
                        });

                        seekBar.value = 0;
                        seekBar.style.setProperty('--value', 0);
                        lyricsContent.querySelectorAll('.lyrics-line').forEach(line => line.classList.remove('active'));
                        structureContent.querySelectorAll('.structure-chord').forEach(chord => chord.classList.remove('active'));
                        structureContent.querySelectorAll('.chord-progress').forEach(progress => progress.style.setProperty('--progress', 0));
                        audio.play().catch(err => console.error('Audio play error:', err));
                        requestAnimationFrame(updateProgressBars);
                    });
                    songList.appendChild(songItem);
                });

                playBtn.addEventListener('click', () => {
                    audio.play().catch(err => console.error('Audio play error:', err));
                    playBtn.disabled = true;
                    pauseBtn.disabled = false;
                    requestAnimationFrame(updateProgressBars);
                });
                pauseBtn.addEventListener('click', () => {
                    audio.pause();
                    playBtn.disabled = false;
                    pauseBtn.disabled = true;
                });

                function updateProgressBars(timestamp) {
                    if (!currentTrack || audio.paused) return;

                    if (timestamp - lastUpdateTime < 16) {
                        requestAnimationFrame(updateProgressBars);
                        return;
                    }
                    lastUpdateTime = timestamp;

                    const currentTime = audio.currentTime;
                    const duration = audio.duration || 0;
                    timeline.textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;
                    seekBar.value = duration ? (currentTime / duration) * 100 : 0;
                    seekBar.style.setProperty('--value', seekBar.value);

                    const bpm = parseInt(currentTrack.tempo) || 120;
                    const beatDuration = 60 / bpm;
                    const timingOffset = 0.1;
                    const currentBeat = Math.floor((currentTime + timingOffset) / beatDuration) + 1;

                    lyricsContent.querySelectorAll('.lyrics-line').forEach(line => {
                        const bar = parseInt(line.dataset.bar) || 1;
                        const length = parseFloat(line.dataset.length) || 1;
                        const beatsPerBar = currentTrack.timeSignature === '4/4' ? 4 : 6;
                        const startBeat = bar * beatsPerBar;
                        const endBeat = startBeat + (length * beatsPerBar);
                        line.classList.toggle('active', currentBeat >= startBeat && currentBeat < endBeat);
                    });

                    structureContent.querySelectorAll('.structure-chord').forEach(chord => {
                        const startBeat = parseInt(chord.dataset.beat);
                        const spanLength = parseInt(chord.dataset.span) || 1;
                        const endBeat = startBeat + spanLength - 1;
                        chord.classList.toggle('active', currentBeat >= startBeat && currentBeat <= endBeat);
                    });

                    structureContent.querySelectorAll('.chord-progress').forEach(progress => {
                        const progressBeat = parseInt(progress.dataset.beat);
                        const spanLength = parseInt(progress.dataset.span) || 1;
                        const beatStartTime = (progressBeat - 1) * beatDuration + timingOffset;
                        const beatEndTime = beatStartTime + (beatDuration * spanLength);
                        let progressValue = 0;

                        if (currentTime >= beatEndTime) {
                            progressValue = 100;
                        } else if (currentTime >= beatStartTime && currentTime < beatEndTime) {
                            progressValue = Math.min(100, ((currentTime - beatStartTime) / (beatDuration * spanLength)) * 100);
                        }

                        progress.style.setProperty('--progress', progressValue);
                    });

                    requestAnimationFrame(updateProgressBars);
                }

                audio.addEventListener('timeupdate', () => {
                    if (!audio.paused) {
                        requestAnimationFrame(updateProgressBars);
                    }
                });

                audio.addEventListener('ended', () => {
                    playBtn.disabled = false;
                    pauseBtn.disabled = true;
                    seekBar.value = 0;
                    seekBar.style.setProperty('--value', 0);
                    lyricsContent.querySelectorAll('.lyrics-line').forEach(line => line.classList.remove('active'));
                    structureContent.querySelectorAll('.structure-chord').forEach(chord => chord.classList.remove('active'));
                    structureContent.querySelectorAll('.chord-progress').forEach(progress => progress.style.setProperty('--progress', 0));
                });

                audio.addEventListener('error', () => {
                    console.error('Audio error:', audio.error);
                });
            })
            .catch(error => console.error('Error loading JSON:', error));

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
