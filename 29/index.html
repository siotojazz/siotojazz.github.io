<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sioto Jazz - 29</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'VCR OSD Mono';
      src: url('https://db.onlinewebfonts.com/t/405b800e62e7d8ae5f21fd79db0f4c58.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'VCR OSD Mono', monospace;
      background: #060a0a;
      color: #a0a0a0;
      font-size: 14px;
      line-height: 1.5;
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 20px,
        rgba(0, 204, 255, 0.1) 20px,
        rgba(0, 204, 255, 0.1) 21px
      ),
      repeating-linear-gradient(
        to right,
        transparent 0,
        transparent 20px,
        rgba(0, 204, 255, 0.1) 20px,
        rgba(0, 204, 255, 0.1) 21px
      );
      animation: grid-pulse 8s linear infinite;
      z-index: -2;
      pointer-events: none;
    }

    @keyframes grid-pulse {
      0% { opacity: 0.7; transform: translate(0, 0); }
      50% { opacity: 0.4; transform: translate(2px, 2px); }
      100% { opacity: 0.7; transform: translate(0, 0); }
    }

    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 76, 115, 0.12);
      opacity: 0;
      animation: glitch-overlay 1.5s infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes glitch-overlay {
      0%, 20%, 40%, 60%, 80% { opacity: 0; }
      10% { opacity: 0.12; transform: translateX(3px); }
      30% { opacity: 0.1; transform: translateX(-2px); }
      50% { opacity: 0.12; transform: translateY(2px); }
      70% { opacity: 0.1; transform: translateY(-2px); }
      90% { opacity: 0.12; transform: translateX(1px); }
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 15px;
      background: rgba(8, 12, 12, 0.95);
      border: 2px solid #002244;
      position: relative;
      z-index: 1;
      box-shadow: 0 0 8px rgba(0, 204, 255, 0.1); /* Reduced glow */
    }

    #album-info {
      text-align: center;
      margin-bottom: 20px;
      padding: 8px;
      border: 2px solid #001122;
      background: rgba(8, 12, 12, 0.95);
    }

    #album-cover {
      max-width: 340px;
      min-height: 340px;
      border: 2px solid #001122;
      image-rendering: pixelated;
      display: block;
      margin: 0 auto;
      background: #060a0a;
    }

    #confidential-notice {
      font-family: 'Orbitron', 'VCR OSD Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #ff3333;
      text-transform: uppercase;
      text-align: center;
      margin: 15px auto;
      padding: 8px;
      border: 2px solid #ff3333;
      background: rgba(8, 12, 12, 0.95);
      text-shadow: 0 0 5px #ff3333, 0 0 8px #00ccff; /* Slightly reduced text-shadow */
      animation: neon-pulse 2s infinite;
      position: relative;
    }

    #confidential-notice::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 2px,
        rgba(255, 51, 51, 0.2) 2px,
        rgba(255, 51, 51, 0.2) 4px
      );
      animation: scanline 4s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    #confidential-notice::after {
      content: 'CLASSIFIED';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-45deg);
      font-family: 'Orbitron', 'VCR OSD Mono', monospace;
      font-size: 22px;
      color: #ff3333;
      opacity: 0.3;
      text-shadow: 0 0 8px #ff3333; /* Reduced text-shadow */
      z-index: 0;
    }

    #confidential-notice span {
      position: relative;
      z-index: 2;
    }

    @keyframes neon-pulse {
      0%, 100% { text-shadow: 0 0 5px #ff3333, 0 0 8px #00ccff; }
      50% { text-shadow: 0 0 8px #ff3333, 0 0 12px #00ccff; } /* Reduced intensity */
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    #code-input-section {
      margin: 20px auto;
      padding: 12px;
      border: 2px solid #00ccff;
      background: rgba(8, 12, 12, 0.95);
      text-align: center;
      position: relative;
    }

    #code-input-section::before {
      content: 'ACCESS CODE';
      position: absolute;
      top: -8px;
      left: 12px;
      font-size: 9px;
      color: #00ccff;
      background: #060a0a;
      padding: 2px 6px;
      border: 1px solid #002244;
    }

    #code-input {
      font-family: 'VCR OSD Mono', monospace;
      font-size: 13px;
      padding: 6px 10px;
      background: #001122;
      border: 2px solid #002244;
      color: #00ccff;
      width: 260px;
      margin-right: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #code-input:focus {
      border-color: #00ccff;
      box-shadow: 0 0 3px rgba(0, 204, 255, 0.3); /* Reduced glow */
    }

    #code-submit {
      font-family: 'VCR OSD Mono', monospace;
      font-size: 13px;
      padding: 6px 14px;
      background: linear-gradient(45deg, #001122, #003366);
      border: 2px solid #002244;
      color: #00ccff;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    #code-submit:hover {
      background: linear-gradient(45deg, #002244, #004488);
      transform: translateY(-2px);
      box-shadow: 0 2px 4px rgba(0, 204, 255, 0.2); /* Reduced glow */
    }

    #code-submit:active {
      transform: translateY(0);
      box-shadow: 0 0 2px rgba(0, 204, 255, 0.15); /* Reduced glow */
    }

    #code-message {
      font-family: 'VCR OSD Mono', monospace;
      font-size: 11px;
      margin-top: 10px;
      padding: 6px;
      text-transform: uppercase;
      display: none;
    }

    #code-message.success {
      color: #00ff00;
      border: 1px solid #00ff00;
      background: rgba(0, 255, 0, 0.2);
      display: block;
    }

    #code-message.error {
      color: #ff3333;
      border: 1px solid #ff3333;
      background: rgba(255, 51, 51, 0.2);
      display: block;
    }

    #tracklist {
      margin-bottom: 20px;
      padding: 8px;
      border: 2px solid #002244;
      background: rgba(8, 12, 12, 0.95);
    }

    #tracks {
      list-style: none;
    }

    .track {
      display: flex;
      align-items: center;
      padding: 8px;
      margin-bottom: 8px;
      background: rgba(0, 76, 115, 0.25);
      border: 2px solid #001122;
      position: relative;
      transition: background 0.2s;
    }

    .track:hover {
      background: rgba(0, 76, 115, 0.35);
      box-shadow: 0 0 5px rgba(0, 204, 255, 0.15); /* Reduced glow */
    }

    .track-error {
      background: rgba(255, 51, 51, 0.25);
      border-color: #ff3333;
    }

    .track-error .track-title::after {
      content: ' (Failed to load)';
      color: #ff3333;
      font-size: 11px;
    }

    .track-error .play-pause-btn,
    .track-error .reset-btn,
    .track-error .lyrics-btn,
    .track-error .copy-link-btn {
      border-color: #ff3333;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .track-error .play-pause-btn:hover,
    .track-error .reset-btn:hover,
    .track-error .lyrics-btn:hover,
    .track-error .copy-link-btn:hover {
      background: linear-gradient(45deg, #001122, #003366);
      transform: none;
      box-shadow: none;
    }

    .track-disabled {
      opacity: 0.5;
      background: rgba(0, 76, 115, 0.15);
    }

    .track-disabled .play-pause-btn,
    .track-disabled .reset-btn,
    .track-disabled .lyrics-btn,
    .track-disabled .copy-link-btn {
      border-color: #666;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .track-disabled .play-pause-btn:hover,
    .track-disabled .reset-btn:hover,
    .track-disabled .lyrics-btn:hover,
    .track-disabled .copy-link-btn:hover {
      background: linear-gradient(45deg, #001122, #003366);
      transform: none;
      box-shadow: none;
    }

    .track::before {
      content: 'DATA ' attr(data-id);
      font-family: 'VCR OSD Mono', monospace;
      font-size: 9px;
      color: #00ccff;
      position: absolute;
      top: -8px;
      left: 6px;
      background: #060a0a;
      padding: 2px 6px;
      border: 1px solid #002244;
    }

    .track-info {
      flex: 1;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .track-title {
      font-family: 'VCR OSD Mono', monospace;
      font-size: 20px;
      font-weight: bold;
      color: #d0d0d0;
      text-transform: uppercase;
      flex-shrink: 1;
    }

    .track-label {
      font-family: 'VCR OSD Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid;
    }

    .track-label.accepted {
      background: rgba(0, 255, 0, 0.2);
      color: #00ff00;
      border-color: #00ff00;
    }

    .track-label.official-entry {
      background: rgba(0, 0, 255, 0.2);
      color: #00ccff;
      border-color: #00ccff;
    }

    .track-label.needs-polishing {
      background: rgba(255, 165, 0, 0.2);
      color: #ffa500;
      border-color: #ffa500;
    }

    .track-label.early-demo {
      background: rgba(255, 0, 0, 0.2);
      color: #ff3333;
      border-color: #ff3333;
    }

    .audio-player {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .play-pause-btn,
    .reset-btn,
    .lyrics-btn,
    .copy-link-btn {
      background: linear-gradient(45deg, #001122, #003366);
      border: 2px solid #002244;
      color: #00ccff;
      font-size: 14px;
      padding: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .play-pause-btn:hover,
    .reset-btn:hover,
    .lyrics-btn:hover,
    .copy-link-btn:hover {
      background: linear-gradient(45deg, #002244, #004488);
      transform: translateY(-2px);
      box-shadow: 0 2px 4px rgba(0, 204, 255, 0.2); /* Reduced glow */
    }

    .play-pause-btn:active,
    .reset-btn:active,
    .lyrics-btn:active,
    .copy-link-btn:active {
      transform: translateY(0);
      box-shadow: 0 0 2px rgba(0, 204, 255, 0.15); /* Reduced glow */
    }

    .play-pause-btn::after,
    .reset-btn::after,
    .lyrics-btn::after,
    .copy-link-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(45deg, #002244, #004488);
      color: #00ccff;
      font-size: 10px;
      padding: 4px 8px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      z-index: 10;
    }

    .play-pause-btn:hover::after,
    .reset-btn:hover::after,
    .lyrics-btn:hover::after,
    .copy-link-btn:hover::after {
      opacity: 1;
      visibility: visible;
    }

    .copy-link-btn {
      display: none;
    }

    .track:not(.track-disabled) .copy-link-btn {
      display: inline-block;
    }

    .progress-bar {
      width: 140px;
      height: 22px;
      background: linear-gradient(90deg, #060a0a, #0a1c2a);
      border: 1px solid #001122;
      cursor: pointer;
      position: relative;
      box-shadow: 0 0 3px rgba(0, 204, 255, 0.1); /* Reduced glow */
    }

    .progress {
      height: 100%;
      background: linear-gradient(90deg, #00ccff, #33eeff);
      width: 0;
      transition: width 0.2s ease;
      box-shadow: 0 0 3px rgba(0, 204, 255, 0.3); /* Reduced glow */
    }

    @media (max-width: 600px) {
      .container {
        max-width: 95%;
        margin: 10px auto;
        padding: 10px;
      }
      .progress-bar {
        width: 100px;
      }
      .play-pause-btn,
      .reset-btn,
      .lyrics-btn,
      .copy-link-btn {
        width: 30px;
        height: 30px;
        font-size: 12px;
        padding: 4px;
      }
      .audio-player {
        gap: 8px;
      }
      .track-info {
        gap: 6px;
      }
      .track-title {
        font-size: 16px;
      }
    }

    @keyframes static-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.4); }
    }

    #lyrics-viewer {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(6, 10, 10, 0.95);
      padding: 20px;
      border: 2px solid #00ccff;
      max-width: 450px;
      min-height: 200px;
      max-height: 85vh;
      overflow-y: auto;
      z-index: 2000;
      font-family: 'VCR OSD Mono', monospace;
      box-shadow: 0 0 6px rgba(0, 204, 255, 0.15); /* Reduced glow */
    }

    @media (max-width: 768px) {
      #lyrics-viewer {
        width: 90vw;
        height: 90vh;
        max-width: none;
        max-height: none;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px;
        box-sizing: border-box;
      }

      #lyrics-viewer h3 {
        font-size: 15px;
        margin-bottom: 10px;
      }

      #lyrics-content {
        font-size: 15px;
        min-height: calc(90vh - 70px);
        line-height: 1.6;
      }

      #lyrics-viewer button {
        font-size: 13px;
        padding: 5px 8px;
      }
    }

    #lyrics-viewer.hidden {
      display: none;
    }

    #lyrics-viewer h3 {
      font-size: 15px;
      margin-bottom: 10px;
      border-bottom: 1px solid #002244;
      padding-bottom: 6px;
      color: #00ccff;
      text-align: center;
      text-shadow: 0 0 3px rgba(0, 204, 255, 0.3); /* Reduced glow */
    }

    #lyrics-viewer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 2px,
        rgba(0, 204, 255, 0.05) 2px,
        rgba(0, 204, 255, 0.05) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    @keyframes crt-flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.98; }
    }

    #lyrics-content {
      position: relative;
      color: #00ccff;
      white-space: pre-wrap;
      overflow: hidden;
      display: block;
      min-height: 120px;
      z-index: 2;
      transition: filter 0.3s ease;
      font-size: 15px;
      line-height: 1.6;
    }

    #lyrics-content.typewriter {
      filter: blur(2px);
    }

    #lyrics-content:not(.typewriter) {
      filter: blur(0);
    }

    #lyrics-content.typewriter-cursor::after {
      content: '|';
      display: inline;
      color: #00ccff;
      animation: blink-cursor 0.8s step-end infinite;
      margin-left: 2px;
    }

    @keyframes blink-cursor {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    #lyrics-content .lyric-date {
      color: #00ccff;
      font-style: italic;
      font-size: 11px;
      opacity: 0.7;
      display: block;
      margin-top: 12px;
    }

    #lyrics-content .typed-line {
      opacity: 0;
      animation: type-char 0.03s ease-in forwards;
    }

    @keyframes type-char {
      0% { opacity: 0; filter: brightness(0.5); }
      50% { opacity: 0.7; filter: brightness(1.5); }
      100% { opacity: 1; filter: brightness(1); }
    }

    #lyrics-viewer button {
      background: linear-gradient(45deg, #001122, #003366);
      border: 2px solid #002244;
      color: #00ccff;
      font-size: 14px;
      padding: 5px 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      position: relative;
      z-index: 2;
    }

    #lyrics-viewer button:hover {
      background: linear-gradient(45deg, #002244, #004488);
      transform: translateY(-2px);
      box-shadow: 0 2px 4px rgba(0, 204, 255, 0.2); /* Reduced glow */
    }

    #lyrics-viewer button:active {
      transform: translateY(0);
      box-shadow: 0 0 2px rgba(0, 204, 255, 0.15); /* Reduced glow */
    }
  </style>
</head>
<body>
  <div class="container">
    <section id="album-info">
      <img id="album-cover" src="album_cover.png" alt="Album Cover">
      <div id="confidential-notice">
        <span>CLASSIFIED DEMOS - NO UNAUTHORIZED ACCESS</span>
      </div>
    </section>
    <section id="code-input-section">
      <input type="text" id="code-input" placeholder="ENTER ACCESS CODE" maxlength="50">
      <button id="code-submit"><span>SUBMIT</span></button>
      <div id="code-message"></div>
    </section>
    <section id="tracklist">
      <ul id="tracks"></ul>
    </section>
    <section id="lyrics-viewer" class="hidden">
      <h3><span id="lyrics-title"></span></h3>
      <pre id="lyrics-content"></pre>
      <button class="close-btn" onclick="closeLyrics()"><i class="fas fa-times"></i></button>
    </section>
  </div>
  <script>
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' || event.keyCode === 27) {
        closeLyrics();
      }
    });

    let currentAudio = null;
    let currentButton = null;

    function generateHash(input) {
      function rotateLeft(n, s) {
        return (n << s) | (n >>> (32 - s));
      }
      let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
      let message = encodeURIComponent(input).split('').map(c => c.charCodeAt(0));
      const length = message.length * 8;
      message.push(0x80);
      while ((message.length * 8) % 512 !== 448) {
        message.push(0);
      }
      message.push(0, 0, 0, 0, (length >>> 24) & 0xFF, (length >>> 16) & 0xFF, (length >>> 8) & 0xFF, length & 0xFF);
      for (let i = 0; i < message.length; i += 64) {
        let w = new Array(80);
        for (let j = 0; j < 16; j++) {
          w[j] = (message[i + j * 4] << 24) | (message[i + j * 4 + 1] << 16) | (message[i + j * 4 + 2] << 8) | message[i + j * 4 + 3];
        }
        for (let j = 16; j < 80; j++) {
          w[j] = rotateLeft(w[j - 3] ^ w[j - 8] ^ w[j - 14] ^ w[j - 16], 1);
        }
        let a = h0, b = h1, c = h2, d = h3, e = h4;
        for (let j = 0; j < 80; j++) {
          let f, k;
          if (j < 20) { f = (b & c) | (~b & d); k = 0x5A827999; }
          else if (j < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
          else if (j < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
          else { f = b ^ c ^ d; k = 0xCA62C1D6; }
          let temp = (rotateLeft(a, 5) + f + e + k + w[j]) >>> 0;
          e = d; d = c; c = rotateLeft(b, 30); b = a; a = temp;
        }
        h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
      }
      const hash = [h0, h1, h2, h3, h4].map(h => ('00000000' + h.toString(16)).slice(-8)).join('');
      return hash.slice(0, 32);
    }

    function normalizeTitle(title) {
      return title.toLowerCase().replace(/\s+/g, '');
    }

    function validateAccessCode(code, tracks, isHash = false) {
      console.log(`Validating ${isHash ? 'hash' : 'code'}: ${code}`);
      if (isHash) {
        if (code === generateHash('jazz@0#guiltyfeet')) {
          return { isJazz: true };
        }
        const track = tracks.find(t => generateHash(`${normalizeTitle(t.title)}@${t.id}#guiltyfeet`) === code);
        if (track) {
          return { track };
        }
        return null;
      } else {
        if (!code.endsWith('#guiltyfeet')) {
          return null;
        }
        const [titleId] = code.split('#');
        const [title, id] = titleId.split('@');
        if (!title || !id) {
          return null;
        }
        if (title.toLowerCase() === 'jazz' && id === '0') {
          return { isJazz: true };
        }
        const track = tracks.find(t => normalizeTitle(t.title) === normalizeTitle(title) && t.id.toString() === id);
        if (track) {
          return { track };
        }
        return null;
      }
    }

    function updateProgressBar(audio, progressBar) {
      if (!audio || audio.paused || !isFinite(audio.duration)) {
        progressBar.style.width = '0%';
        return;
      }
      const percent = (audio.currentTime / audio.duration) * 100;
      progressBar.style.width = `${percent}%`;
      console.log(`Progress for audio-${audio.id}: ${percent.toFixed(2)}%`);
    }

    const params = new URLSearchParams(window.location.search);
    const trackParam = params.get('track');
    console.log(`URL trackParam: ${trackParam}`);

    fetch('album.json')
      .then(response => {
        if (!response.ok) throw new Error('Failed to load album.json');
        return response.json();
      })
      .then(albumData => {
        document.getElementById('album-cover').src = albumData.album.coverImage || 'album_cover.png';
        const trackList = document.getElementById('tracks');

        const urlValidation = trackParam ? validateAccessCode(trackParam, albumData.tracks, true) : null;
        const isJazzEnabled = urlValidation && urlValidation.isJazz;
        const enabledTrack = urlValidation && urlValidation.track;

        albumData.tracks.forEach(track => {
          const audio = new Audio(track.mp3);
          audio.id = `audio-${track.id}`;
          audio.preload = 'metadata';
          document.body.appendChild(audio);

          const isTrackEnabled = isJazzEnabled || (enabledTrack && enabledTrack.id === track.id && normalizeTitle(enabledTrack.title) === normalizeTitle(track.title));
          console.log(`Track ${track.title} (ID: ${track.id}) enabled: ${isTrackEnabled}`);

          const li = document.createElement('li');
          li.className = `track ${isTrackEnabled ? '' : 'track-disabled'}`;
          li.setAttribute('data-id', track.id);
          li.innerHTML = `
            <div class="track-info">
              <span class="track-title">${track.title}</span>
              <span class="track-label ${track.label.replace(/\s+/g, '-').toLowerCase()}">${track.label}</span>
            </div>
            <div class="audio-player" id="player-${track.id}">
              <button class="play-pause-btn" data-id="${track.id}" data-tooltip="Play/Pause" ${isTrackEnabled ? '' : 'disabled'}><span><i class="fas fa-play"></i></span></button>
              <div class="progress-bar" data-id="${track.id}"><div class="progress" id="progress-${track.id}"></div></div>
              <button class="reset-btn" data-id="${track.id}" data-tooltip="Reset" ${isTrackEnabled ? '' : 'disabled'}><span><i class="fas fa-undo"></i></span></button>
              <button class="lyrics-btn" onclick="showLyrics(${track.id})" data-tooltip="Lyrics" ${isTrackEnabled ? '' : 'disabled'}><span><i class="fas fa-book"></i></span></button>
              <button class="copy-link-btn" data-id="${track.id}" data-tooltip="Copy Link" ${isTrackEnabled ? '' : 'disabled'}><span><i class="fas fa-link"></i></span></button>
            </div>
          `;
          trackList.appendChild(li);

          const progressBar = document.getElementById(`progress-${track.id}`);
          audio.addEventListener('loadedmetadata', () => {
            console.log(`Metadata loaded for audio-${track.id}, duration: ${audio.duration}`);
          });
          audio.addEventListener('timeupdate', () => {
            updateProgressBar(audio, progressBar);
          });
          audio.addEventListener('ended', () => {
            progressBar.style.width = '0%';
            li.querySelector('.play-pause-btn i').className = 'fas fa-play';
            currentAudio = null;
            currentButton = null;
            console.log(`Audio-${track.id} ended`);
          });
          audio.addEventListener('error', () => {
            console.warn(`Failed to load audio for ${track.mp3}`);
            li.classList.add('track-error');
            li.querySelector('.play-pause-btn').disabled = true;
            li.querySelector('.reset-btn').disabled = true;
            li.querySelector('.lyrics-btn').disabled = true;
            li.querySelector('.copy-link-btn').disabled = true;
            progressBar.style.width = '0%';
            document.getElementById('code-message').textContent = `ERROR: FAILED TO LOAD TRACK ${track.title.toUpperCase()}`;
            document.getElementById('code-message').className = 'error';
          });
        });

        const codeInput = document.getElementById('code-input');
        const codeSubmit = document.getElementById('code-submit');
        const codeMessage = document.getElementById('code-message');

        codeSubmit.addEventListener('click', () => {
          const code = codeInput.value.trim();
          console.log(`Submit clicked, code: ${code}`);
          let isValid = false;
          let message = '';

          if (!code) {
            message = 'ERROR: NO CODE ENTERED';
          } else {
            const validation = validateAccessCode(code, albumData.tracks);
            if (validation) {
              isValid = true;
              if (validation.isJazz) {
                message = 'ACCESS GRANTED: ALL TRACKS UNLOCKED';
                const hash = generateHash('jazz@0#guiltyfeet');
                console.log(`Updating URL to: ?track=${hash}`);
                window.location.search = `?track=${hash}`;
              } else {
                message = `ACCESS GRANTED: ${validation.track.title.toUpperCase()} UNLOCKED`;
                const hash = generateHash(`${normalizeTitle(validation.track.title)}@${validation.track.id}#guiltyfeet`);
                console.log(`Updating URL to: ?track=${hash}`);
                window.location.search = `?track=${hash}`;
              }
            } else {
              message = 'ERROR: INVALID ACCESS CODE';
            }
          }

          codeMessage.textContent = message;
          codeMessage.className = isValid ? 'success' : 'error';
          console.log(`Message: ${message}, isValid: ${isValid}`);
        });

        codeInput.addEventListener('keypress', (event) => {
          if (event.key === 'Enter') {
            console.log('Enter key pressed');
            codeSubmit.click();
          }
        });

        document.querySelectorAll('.play-pause-btn').forEach(button => {
          button.addEventListener('click', () => {
            if (button.disabled) return;
            const trackId = button.dataset.id;
            const audio = document.getElementById(`audio-${trackId}`);
            const progressBar = document.getElementById(`progress-${trackId}`);

            if (currentAudio && currentAudio !== audio) {
              currentAudio.pause();
              currentButton.querySelector('i').className = 'fas fa-play';
              document.getElementById(`progress-${currentAudio.id.split('-')[1]}`).style.width = '0%';
            }

            if (audio.paused) {
              audio.play().catch(error => {
                console.error(`Playback failed for track ${trackId}: ${error}`);
                button.closest('.track').classList.add('track-error');
                button.disabled = true;
                button.closest('.audio-player').querySelector('.reset-btn').disabled = true;
                button.closest('.audio-player').querySelector('.lyrics-btn').disabled = true;
                button.closest('.audio-player').querySelector('.copy-link-btn').disabled = true;
                progressBar.style.width = '0%';
                document.getElementById('code-message').textContent = `ERROR: FAILED TO PLAY TRACK ${trackId}`;
                document.getElementById('code-message').className = 'error';
              });
              button.querySelector('i').className = 'fas fa-pause';
              currentAudio = audio;
              currentButton = button;
            } else {
              audio.pause();
              button.querySelector('i').className = 'fas fa-play';
              currentAudio = null;
              currentButton = null;
            }
          });
        });

        document.querySelectorAll('.reset-btn').forEach(button => {
          button.addEventListener('click', () => {
            if (button.disabled) return;
            const trackId = button.dataset.id;
            const audio = document.getElementById(`audio-${trackId}`);
            const progressBar = document.getElementById(`progress-${trackId}`);
            if (!audio) return;

            audio.currentTime = 0;
            progressBar.style.width = '0%';
            if (currentAudio === audio && !audio.paused) {
              audio.play().catch(error => {
                console.error(`Playback failed after reset for track ${trackId}: ${error}`);
                button.closest('.track').classList.add('track-error');
                button.disabled = true;
                button.closest('.audio-player').querySelector('.play-pause-btn').disabled = true;
                button.closest('.audio-player').querySelector('.lyrics-btn').disabled = true;
                button.closest('.audio-player').querySelector('.copy-link-btn').disabled = true;
                progressBar.style.width = '0%';
                document.getElementById('code-message').textContent = `ERROR: FAILED TO RESET TRACK ${trackId}`;
                document.getElementById('code-message').className = 'error';
              });
            }
          });
        });

        document.querySelectorAll('.progress-bar').forEach(bar => {
          function handleSeek(event) {
            const trackId = bar.dataset.id;
            const audio = document.getElementById(`audio-${trackId}`);
            const progress = document.getElementById(`progress-${trackId}`);
            const playButton = bar.closest('.audio-player').querySelector('.play-pause-btn');
            if (!audio || !isFinite(audio.duration) || playButton.disabled) return;

            const rect = bar.getBoundingClientRect();
            const clientX = event.type.includes('touch') ? event.touches[0].clientX : event.clientX;
            const percentage = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            audio.currentTime = percentage * audio.duration;
            progress.style.width = `${percentage * 100}%`;
            console.log(`Seek to ${percentage * 100}% for audio-${trackId}`);

            if (currentAudio && currentAudio !== audio) {
              currentAudio.pause();
              currentButton.querySelector('i').className = 'fas fa-play';
              document.getElementById(`progress-${currentAudio.id.split('-')[1]}`).style.width = '0%';
              currentAudio = null;
              currentButton = null;
            }

            if (audio.paused) {
              audio.play().catch(error => {
                console.error(`Playback failed after seek for track ${trackId}: ${error}`);
                bar.closest('.track').classList.add('track-error');
                playButton.disabled = true;
                bar.closest('.audio-player').querySelector('.reset-btn').disabled = true;
                bar.closest('.audio-player').querySelector('.lyrics-btn').disabled = true;
                bar.closest('.audio-player').querySelector('.copy-link-btn').disabled = true;
                progress.style.width = '0%';
                document.getElementById('code-message').textContent = `ERROR: FAILED TO SEEK TRACK ${trackId}`;
                document.getElementById('code-message').className = 'error';
              });
              playButton.querySelector('i').className = 'fas fa-pause';
              currentAudio = audio;
              currentButton = playButton;
            }
          }

          bar.addEventListener('click', handleSeek);
          bar.addEventListener('mousedown', () => {
            const moveHandler = (event) => handleSeek(event);
            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('mouseup', () => {
              document.removeEventListener('mousemove', moveHandler);
            }, { once: true });
          });

          bar.addEventListener('touchstart', (event) => {
            event.preventDefault();
            const touchHandler = (e) => handleSeek(e);
            document.addEventListener('touchmove', touchHandler);
            document.addEventListener('touchend', () => {
              document.removeEventListener('touchmove', touchHandler);
            }, { once: true });
          });
        });

        document.querySelectorAll('.copy-link-btn').forEach(button => {
          button.addEventListener('click', () => {
            if (button.disabled) return;
            const trackId = button.dataset.id;
            const track = albumData.tracks.find(t => t.id.toString() === trackId);
            const hash = generateHash(`${normalizeTitle(track.title)}@${track.id}#guiltyfeet`);
            const url = `${window.location.origin}${window.location.pathname}?track=${hash}`;
            navigator.clipboard.writeText(url).then(() => {
              const message = document.getElementById('code-message');
              message.textContent = `LINK COPIED: ${track.title.toUpperCase()}`;
              message.className = 'success';
              setTimeout(() => {
                message.textContent = '';
                message.className = '';
              }, 3000);
            }).catch(err => {
              console.error(`Failed to copy link: ${err}`);
              const message = document.getElementById('code-message');
              message.textContent = 'ERROR: FAILED TO COPY LINK';
              message.className = 'error';
              setTimeout(() => {
                message.textContent = '';
                message.className = '';
              }, 3000);
            });
          });
        });

        window.showLyrics = function(trackId) {
          const lyricsButton = document.querySelector(`.audio-player#player-${trackId} .lyrics-btn`);
          if (lyricsButton.disabled) return;

          const track = albumData.tracks.find(t => t.id === trackId);
          const lyricsContent = document.getElementById('lyrics-content');
          let lyrics = track.lyrics || 'No lyrics available';
          const date = track.date || '';

          lyrics = lyrics.replace(/\[(\d{2}:\d{2})\]/g, '[$1]');

          document.getElementById('lyrics-title').textContent = track.title;
          lyricsContent.innerHTML = '';
          lyricsContent.classList.add('typewriter', 'typewriter-cursor');
          document.getElementById('lyrics-viewer').classList.remove('hidden');

          const lines = lyrics.split('\n');
          let lineIndex = 0;
          const totalDuration = 300;
          const delayPerLine = lines.length > 0 ? totalDuration / lines.length : 10;

          function typeNextLine() {
            if (lineIndex < lines.length) {
              const line = lines[lineIndex];
              const span = document.createElement('span');
              span.className = 'typed-line';
              span.textContent = line;
              lyricsContent.appendChild(span);
              lyricsContent.appendChild(document.createElement('br'));

              lyricsContent.scrollTop = lyricsContent.scrollHeight;

              lineIndex++;
              setTimeout(typeNextLine, delayPerLine);
            } else {
              lyricsContent.classList.remove('typewriter', 'typewriter-cursor');
              if (date) {
                const dateSpan = document.createElement('span');
                dateSpan.className = 'lyric-date';
                dateSpan.textContent = `\n\n${date}`;
                lyricsContent.appendChild(dateSpan);
              }
            }
          }

          setTimeout(typeNextLine, 50);
        };

        window.closeLyrics = function() {
          document.getElementById('lyrics-viewer').classList.add('hidden');
          document.getElementById('lyrics-content').innerHTML = '';
        };
      })
      .catch(error => {
        console.error(`Error loading album data: ${error}`);
        document.getElementById('album-cover').src = 'album_cover.png';
        document.getElementById('code-message').textContent = 'ERROR: FAILED TO LOAD ALBUM DATA';
        document.getElementById('code-message').className = 'error';
      });
  </script>
</body>
</html>
