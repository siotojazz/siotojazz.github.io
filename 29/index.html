<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiotoJazz - 29</title>
    <style>
        @font-face {
            font-family: 'Astrella';
            src: url('../fonts/Astrella.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Garet';
            src: url('../fonts/Garet.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'MS Sans Serif', Arial, sans-serif;
            background: #007c7e;
            color: #000;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-text-size-adjust: 100%;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to right,#03007a 0%, #03007a 50%, #0403ed 80%, #03007a 100%);
            border: 2px outset #fff;
            box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #000;
            margin: 0;
            width: 100%;
            max-width: 600px;
        }
        header .title-container {
            padding: 4px 18px;
            background: transparent;
            font-size: 60px;
        }
        span#album-title {
            font-weight: 100;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            font-family: "MS Sans Serif", "Microsoft Sans Serif", "Arial", sans-serif;
            display: inline-block !important;
            margin-left: 10px;
        }
        span#album-band {
            color: #dfdfdf;
            text-shadow: 1px 1px 0 #000;
            font-family: 'Astrella', cursive;
            text-transform: uppercase;
            line-height: 22px;
            display: inline-block !important;
        }
        header img {
            height: 100%;
            width: auto;
            max-width: 80px;
            border: none;
            box-shadow: none;
            padding: 0;
            margin: 0;
            object-fit: cover;
            object-position: left; /* Changed from right to left */
            mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%); /* Reversed gradient direction */
            -webkit-mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%); /* Reversed gradient direction */
        }
        .song-list {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px;
            background: #c0c0c0;
            border: 2px outset #fff;
        }
        .song-item {
            flex: 1 1 calc(33.33% - 4px);
            padding: 0;
            background: #c0c0c0;
            border: 2px outset #fff;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            line-height: 24px;
        }
        .song-item:hover {
            background: #d3d3d3;
        }
        .song-item.active {
            background: #00017b;
            color: #fff;
            border: 2px inset #fff;
        }
        .player {
            max-width: 600px;
            width: 100%;
            padding: 8px;
            background: #c0c0c0;
            border: 2px outset #fff;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: nowrap;
        }
        .player-controls button {
            padding: 4px 8px;
            background: #c0c0c0;
            border: 2px outset #fff;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 24px;
            line-height: 1;
        }
        .player-controls button:disabled {
            color: #808080;
            border: 2px inset #fff;
            cursor: default;
        }
        .player-controls button .icon {
            font-size: 14px;
            line-height: 1;
        }
        .player-timeline {
            font-size: 12px;
            text-align: right;
            padding-right: 8px;
        }
        .current-info {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .current-lyric {
            color: #00017b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .current-chord {
            color: #00017b;
            font-weight: bold;
        }
        .chord-instructions {
            color: #555;
            font-style: italic;
        }
        .seek-bar-container {
            width: 100%;
            margin: 6px 0;
            border: 2px inset #AAA;
            background: #fff;
        }
        .seek-bar {
            width: 100%;
            height: 12px;
            -webkit-appearance: none;
            appearance: none;
            background: #fff;
            border: none;
            outline: none;
            cursor: pointer;
        }
        .seek-bar::-webkit-slider-runnable-track {
            height: 12px;
            background: #fff;
        }
        .seek-bar::-moz-range-track {
            height: 12px;
            background: #fff;
        }
        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 0;
            height: 0;
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
        .seek-bar::-moz-range-thumb {
            width: 0;
            height: 0;
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
        .seek-bar::-ms-thumb {
            width: 0;
            height: 0;
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
        .seek-bar[value]::-webkit-slider-runnable-track {
            background: linear-gradient(
                to right,
                repeating-linear-gradient(
                    to right,
                    #00017b 0%,
                    #00017b 8px,
                    #c0c0c0 8px,
                    #c0c0c0 10px
                ) 0% / calc(var(--value) * 1%) 100% no-repeat,
                #fff
            );
        }
        .seek-bar[value]::-moz-range-progress {
            height: 12px;
            background: repeating-linear-gradient(
                to right,
                #00017b 0%,
                #00017b 8px,
                #c0c0c0 8px,
                #c0c0c0 10px
            );
        }
        .seek-bar::-ms-fill-lower {
            background: repeating-linear-gradient(
                to right,
                #00017b 0%,
                #00017b 8px,
                #c0c0c0 8px,
                #c0c0c0 10px
            );
        }
        .seek-bar::-ms-fill-upper {
            background: #fff;
        }
        .content-container {
            display: flex;
            gap: 8px;
        }
        .lyrics, .structure {
            flex: 1;
            padding: 6px;
            background: #fff;
            border: 2px inset #AAA;
            font-size: 12px;
        }
        .lyrics {
            padding: 0px;
        }
        .lyrics h4, .structure h4 {
            font-size: 12px;
            color: #000;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .lyrics h4 {
            margin: 5px;
        }
        .tempo-info {
            font-size: 12px;
            color: #00017b;
            margin-bottom: 6px;
        }
        .section-label {
            font-weight: bold;
            margin: 8px 0 4px;
            font-size: 12px;
            color: #00017b;
        }
        .lyrics-line, .structure-block {
            cursor: pointer;
        }
        .lyrics-line {
            padding: 1px 5px;
        }
        .lyrics-line.active {
            background: #00017b;
            color: #fff;
        }
        .lyrics-line.passed {
            opacity: 0.5;
        }
        .structure-chord {
            display: block;
            background: #d3d3d3;
            padding: 2px 4px;
            font-size: 11px;
            cursor: pointer;
            position: relative;
            border: 2px outset #fff;
        }
        .structure-chord.active {
            background: #00017b;
            color: #fff;
            border: 2px inset #AAA;
            padding: 2px 4px;
        }
        .structure-chord.passed {
            opacity: 0.5;
        }
        .structure-chord:hover .chord-value,
        .structure-chord:hover .chord-diagram {
            display: block;
        }
        .stanza-end {
            margin-bottom: 12px;
        }
        .structure-block {
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .chord-container {
            flex: 1;
            text-align: center;
            position: relative;
        }
        .chord-value {
            display: none;
            position: absolute;
            bottom: calc(100% + 20px);
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 2px 4px;
            font-size: 10px;
            z-index: 10;
            border: 1px solid #fff;
            white-space: nowrap;
        }
        .chord-diagram {
            display: none;
            position: absolute;
            bottom: calc(100% + 40px);
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 4px;
            font-size: 10px;
            z-index: 11;
            border: 1px solid #fff;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre;
            line-height: 1.2;
            text-align: center;
        }
        .chord-progress {
            width: 100%;
            height: 6px;
            background: #c0c0c0;
            border: 1px inset #fff;
            margin-top: 2px;
            position: relative;
            overflow: hidden;
        }
        .chord-progress::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: calc(var(--progress, 0) * 1%);
            background: repeating-linear-gradient(
                to right,
                #00017b 0%,
                #00017b 8px,
                #c0c0c0 8px,
                #c0c0c0 10px
            );
            transition: width 0.01s linear;
        }
        audio {
            display: none;
        }
        @media (max-width: 600px) {
            body {
                padding: 4px;
            }
            header {
                padding: 4px;
                max-width: 100%;
            }
            header h1 {
                font-size: 16px;
            }
            header p {
                font-size: 14px;
                line-height: 18px;
            }
            header img {
                max-width: 50px;
                height: 100%;
            }
            .song-list {
                max-width: 100%;
                padding: 6px 0;
                margin: 6px 0;
                gap: 3px;
            }
            .song-item {
                flex: 1 1 100%;
                font-size: 12px;
                line-height: 20px;
                padding: 5px 0;
            }
            .player {
                max-width: 100%;
                padding: 4px;
            }
            .player-controls {
                gap: 4px;
            }
            .player-controls button {
                width: 32px;
                height: 20px;
                padding: 3px 5px;
                font-size: 12px;
            }
            .player-controls button .icon {
                font-size: 14px;
            }
            .player-timeline {
                font-size: 12px;
                padding-right: 4px;
            }
            .seek-bar-container {
                margin: 4px 0;
            }
            .seek-bar {
                height: 8px;
            }
            .seek-bar::-webkit-slider-runnable-track,
            .seek-bar::-moz-range-track {
                height: 8px;
            }
            .seek-bar[value]::-webkit-slider-runnable-track {
                background: linear-gradient(
                    to right,
                    repeating-linear-gradient(
                        to right,
                        #00017b 0%,
                        #00017b 5px,
                        #c0c0c0 5px,
                        #c0c0c0 6px
                    ) 0% / calc(var(--value) * 1%) 100% no-repeat,
                    #fff
                );
            }
            .seek-bar[value]::-moz-range-progress {
                height: 8px;
                background: repeating-linear-gradient(
                    to right,
                    #00017b 0%,
                    #00017b 5px,
                    #c0c0c0 5px,
                    #c0c0c0 6px
                );
            }
            .seek-bar::-ms-fill-lower {
                background: repeating-linear-gradient(
                    to right,
                    #00017b 0%,
                    #00017b 5px,
                    #c0c0c0 5px,
                    #c0c0c0 6px
                );
            }
            .current-info {
                font-size: 11px;
                gap: 6px;
            }
            .content-container {
                flex-direction: column;
                gap: 6px;
            }
            .lyrics, .structure {
                font-size: 10px;
            }
            .lyrics h4, .structure h4 {
                font-size: 11px;
                margin-bottom: 2px;
            }
            .tempo-info {
                font-size: 11px;
                margin-bottom: 4px;
            }
            .section-label {
                font-size: 11px;
                margin: 6px 0 3px;
            }
            .structure-chord {
                font-size: 10px;
                padding: 1px 2px;
            }
            .chord-value, .chord-diagram {
                font-size: 9px;
                padding: 2px;
            }
            .chord-progress {
                height: 4px;
            }
        }
        @media (max-width: 400px) {
            .song-item {
                font-size: 11px;
                line-height: 18px;
            }
            .player-controls button {
                width: 30px;
                height: 18px;
                font-size: 11px;
            }
            .player-controls button .icon {
                font-size: 12px;
            }
            .player-timeline {
                font-size: 11px;
            }
            .current-info {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img id="album-cover" src="album_cover.png" alt="Album Cover">
        <div class="title-container">
            <span id="album-band"></span><span id="album-title"></span>
        </div>
    </header>

    <section class="song-list" id="song-list"></section>
    <section class="player" id="player">
        <div class="player-controls">
            <button class="play-btn" disabled aria-label="Play audio"><span class="icon">▶</span></button>
            <button class="pause-btn" disabled aria-label="Pause audio"><span class="icon">||</span></button>
            <div class="current-info">
                <span class="current-lyric"></span>
                <span class="current-chord"></span>
                <span class="chord-instructions"></span>
            </div>
            <span class="player-timeline">0:00 / 0:00</span>
        </div>
        <div class="seek-bar-container">
            <input type="range" class="seek-bar" min="0" max="100" value="0" style="--value: 0;">
        </div>
        <audio id="audio-player"></audio>
        <div class="content-container">
            <div class="lyrics">
                <h4>Lyrics</h4>
                <div class="lyrics-content"></div>
            </div>
            <div class="structure">
                <h4>Structure</h4>
                <div class="structure-content"></div>
            </div>
        </div>
    </section>

    <script>
    fetch('album.json')
    .then(response => response.json())
    .then(data => {
        document.getElementById('album-title').textContent = data.album.title;
        document.getElementById('album-band').textContent = data.album.band;

        const chordMap = new Map(data.chords.map(chordObj => {
            const chordName = Object.keys(chordObj)[0];
            const tab = chordObj[chordName]; // e.g., "x32010"
            // Generate ASCII chord diagram with finger placements
            const diagram = generateChordDiagram(chordName, tab);
            return [chordName, { instructions: tab, diagram }];
        }));

function generateChordDiagram(chordName, tab) {
    // Fallback for invalid or missing tab (wrong length or non-parsable values)
    if (!tab || tab.length !== 6 || tab.split('').some(f => f !== 'x' && isNaN(parseInt(f)))) {
        return `    01 02 03 04 05
e |              
B |              
G |              
D |              
A |              
E |              `;
    }

    const strings = ['e', 'B', 'G', 'D', 'A', 'E']; // High e at top, low E at bottom

    // Parse frets, reversing to match display order (tab: low E to high e; display: high e to low E)
    let frets = tab.split('').map(f => f.toLowerCase() === 'x' ? 'x' : parseInt(f)).reverse();

    // Determine fret range, ignoring open strings (0) and muted strings ('x')
    let minFret = Infinity;
    let maxFret = 0;
    frets.forEach(f => {
        if (f !== 'x' && f > 0) {
            minFret = Math.min(minFret, f);
            maxFret = Math.max(maxFret, f);
        }
    });

    // Default to frets 1–5 if no fretted notes (all open or muted)
    if (minFret === Infinity) {
        minFret = 1;
        maxFret = 5;
    }

    // Fixed 5-fret range, centered around fretted notes
    const fretRange = 5;
    let startFret = Math.max(1, minFret - 1); // Place minFret at position 2 for centering
    if (startFret + fretRange - 1 < maxFret) {
        startFret = maxFret - fretRange + 2; // Place maxFret at position 4 for centering
    }

    // Generate fret numbers in ascending order (length 14 chars)
    const fretNumbers = Array.from(
        { length: fretRange },
        (_, i) => (startFret + i).toString().padStart(2, '0')
    ).join(' ');
    let diagram = `    ${fretNumbers}\n`;

    // Build each string line with fixed alignment (total line length: 18 chars)
    for (let i = 0; i < 6; i++) {
        const fret = frets[i];
        let stringLine = `${strings[i]} | `; // Prefix length 4 (e.g., 'e | ')

        if (fret === 'x') {
            stringLine += 'x             '; // 13 spaces after 'x'
        } else if (fret === 0) {
            stringLine += '              '; // 14 spaces for open string
        } else {
            let content = '              '; // 14 spaces
            const relativeFret = fret - startFret;
            if (relativeFret >= 0 && relativeFret < fretRange) {
                const pos = 1 + relativeFret * 3; // Align • under second digit of fret number
                content = content.substring(0, pos) + '•' + content.substring(pos + 1);
            }
            stringLine += content;
        }
        diagram += stringLine + '\n';
    }

    return diagram;
}

const songList = document.getElementById('song-list');
        const player = document.getElementById('player');
        const audio = document.getElementById('audio-player');
        const playBtn = player.querySelector('.play-btn');
        const pauseBtn = player.querySelector('.pause-btn');
        const timeline = player.querySelector('.player-timeline');
        const seekBar = player.querySelector('.seek-bar');
        const lyricsContent = player.querySelector('.lyrics-content');
        const structureContent = player.querySelector('.structure-content');
        const currentLyricDisplay = player.querySelector('.current-lyric');
        const currentChordDisplay = player.querySelector('.current-chord');
        const chordInstructionsDisplay = player.querySelector('.chord-instructions');
        let currentTrack = null;
        let lastUpdateTime = 0;

        seekBar.addEventListener('input', () => {
            seekBar.style.setProperty('--value', seekBar.value);
            if (currentTrack) {
                const duration = audio.duration || 0;
                audio.currentTime = (seekBar.value / 100) * duration;
            }
        });

        data.tracks.forEach(track => {
            const songItem = document.createElement('div');
            songItem.className = 'song-item';
            songItem.textContent = track.title;
            songItem.addEventListener('click', () => {
                if (currentTrack) {
                    audio.pause();
                    audio.currentTime = 0;
                }
                document.querySelectorAll('.song-item').forEach(item => item.classList.remove('active'));
                songItem.classList.add('active');
                playBtn.disabled = true;
                pauseBtn.disabled = false;

                audio.src = track.mp3;
                if (!audio.src) {
                    console.error('Invalid audio source for track:', track.title);
                    return;
                }
                lyricsContent.innerHTML = '';
                structureContent.innerHTML = '';
                currentLyricDisplay.textContent = '';
                currentChordDisplay.textContent = '';
                chordInstructionsDisplay.textContent = '';
                currentTrack = track;

                // Add tempo and time signature information
                const tempoInfo = document.createElement('div');
                tempoInfo.className = 'tempo-info';
                tempoInfo.textContent = `Tempo: ${track.tempo} BPM | Time Signature: ${track.timeSignature}`;
                structureContent.appendChild(tempoInfo);

                track.lyrics.forEach((line, index) => {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'lyrics-line';
                    lineDiv.dataset.index = index;
                    lineDiv.dataset.bar = line.barNumber || 1;
                    lineDiv.dataset.length = line.barLength || 1;
                    lineDiv.dataset.offset = line.offset || 0;
                    if (line.stanzaEnd) lineDiv.classList.add('stanza-end');
                    lineDiv.textContent = line.line || ' ';
                    lineDiv.addEventListener('click', () => {
                        if (currentTrack === track) {
                            const bpm = parseInt(track.tempo) || 120;
                            const isSixEight = track.timeSignature === '6/8';
                            const beatDuration = isSixEight ? (60 / bpm) * 1.5 : 60 / bpm;
                            const bar = parseInt(lineDiv.dataset.bar) || 1;
                            const offset = parseFloat(lineDiv.dataset.offset) || 0;
                            const beatsPerBar = isSixEight ? 2 : 4;
                            const startTime = (bar * beatsPerBar * beatDuration) + offset;
                            audio.currentTime = startTime;
                            audio.play().catch(err => console.error('Audio play error:', err));
                            playBtn.disabled = true;
                            pauseBtn.disabled = false;
                        }
                    });
                    lyricsContent.appendChild(lineDiv);
                });

                let beatIndex = 0;
                track.structure.sections.forEach(section => {
                    const sectionLabel = document.createElement('div');
                    sectionLabel.className = 'section-label';
                    sectionLabel.textContent = section.label;
                    structureContent.appendChild(sectionLabel);

                    for (let i = 0; i < section.chords.length; i += 8) {
                        const blockChords = section.chords.slice(i, i + 8);
                        const blockDiv = document.createElement('div');
                        blockDiv.className = 'structure-block';
                        blockDiv.dataset.bar = i / 4 + 1;

                        for (let barOffset = 0; barOffset < blockChords.length; barOffset += 4) {
                            const barChords = blockChords.slice(barOffset, barOffset + 4);
                            let j = 0;
                            while (j < barChords.length) {
                                let chord = barChords[j];
                                let chordSpanLength = 1;
                                while (j + chordSpanLength < barChords.length && barChords[j + chordSpanLength] === chord) {
                                    chordSpanLength++;
                                }

                                const chordContainer = document.createElement('div');
                                chordContainer.className = 'chord-container';
                                chordContainer.style.flex = chordSpanLength;
                                const chordSpan = document.createElement('span');
                                chordSpan.className = 'structure-chord';
                                chordSpan.dataset.beat = beatIndex + 1;
                                chordSpan.dataset.span = chordSpanLength;
                                const chordData = chordMap.get(chord) || { instructions: 'N/A', diagram: '' };
                                chordSpan.innerHTML = `
                                    <span class="chord">${chord || 'N/A'}</span>
                                    <span class="chord-value">${chordData.instructions}</span>
                                    <span class="chord-diagram">${chordData.diagram}</span>
                                `;
                                const progressDiv = document.createElement('div');
                                progressDiv.className = 'chord-progress';
                                progressDiv.dataset.beat = beatIndex + 1;
                                progressDiv.dataset.span = chordSpanLength;

                                chordSpan.addEventListener('click', () => {
                                    if (currentTrack === track) {
                                        const bpm = parseInt(track.tempo) || 120;
                                        const isSixEight = track.timeSignature === '6/8';
                                        const beatDuration = isSixEight ? (60 / bpm) * 1.5 : 60 / bpm;
                                        const beat = parseInt(chordSpan.dataset.beat);
                                        const startTime = (beat - 1) * beatDuration;
                                        audio.currentTime = startTime;
                                        audio.play().catch(err => console.error('Audio play error:', err));
                                        playBtn.disabled = true;
                                        pauseBtn.disabled = false;
                                    }
                                });

                                chordContainer.appendChild(chordSpan);
                                chordContainer.appendChild(progressDiv);
                                blockDiv.appendChild(chordContainer);

                                beatIndex += chordSpanLength;
                                j += chordSpanLength;
                            }
                        }
                        structureContent.appendChild(blockDiv);
                    }
                });

                seekBar.value = 0;
                seekBar.style.setProperty('--value', 0);
                lyricsContent.querySelectorAll('.lyrics-line').forEach(line => {
                    line.classList.remove('active');
                    line.classList.remove('passed');
                });
                structureContent.querySelectorAll('.structure-chord').forEach(chord => {
                    chord.classList.remove('active');
                    chord.classList.remove('passed');
                });
                structureContent.querySelectorAll('.chord-progress').forEach(progress => progress.style.setProperty('--progress', 0));
                audio.play().catch(err => console.error('Audio play error:', err));
                requestAnimationFrame(updateProgressBars);
            });
            songList.appendChild(songItem);
        });

        playBtn.addEventListener('click', () => {
            audio.play().catch(err => console.error('Audio play error:', err));
            playBtn.disabled = true;
            pauseBtn.disabled = false;
            requestAnimationFrame(updateProgressBars);
        });
        pauseBtn.addEventListener('click', () => {
            audio.pause();
            playBtn.disabled = false;
            pauseBtn.disabled = true;
        });

        function updateProgressBars(timestamp) {
            if (!currentTrack || audio.paused) return;

            if (timestamp - lastUpdateTime < 16) {
                requestAnimationFrame(updateProgressBars);
                return;
            }
            lastUpdateTime = timestamp;

            const currentTime = audio.currentTime;
            const duration = audio.duration || 0;
            timeline.textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;
            seekBar.value = duration ? (currentTime / duration) * 100 : 0;
            seekBar.style.setProperty('--value', seekBar.value);

            const bpm = parseInt(currentTrack.tempo) || 120;
            const isSixEight = currentTrack.timeSignature === '6/8';
            const beatDuration = isSixEight ? (60 / bpm) * 1.5 : 60 / bpm;
            const currentBeat = Math.floor(currentTime / beatDuration);

            let currentLyric = '';
            lyricsContent.querySelectorAll('.lyrics-line').forEach(line => {
                const bar = parseInt(line.dataset.bar) || 1;
                const length = parseFloat(line.dataset.length) || 1;
                const offset = parseFloat(line.dataset.offset) || 0;
                const beatsPerBar = isSixEight ? 2 : 4;
                const startTime = (bar * beatsPerBar * beatDuration) + offset;
                const endTime = startTime + (length * beatsPerBar * beatDuration);
                line.classList.toggle('active', currentTime >= startTime && currentTime < endTime);
                line.classList.toggle('passed', currentTime >= endTime);
                if (currentTime >= startTime && currentTime < endTime) {
                    currentLyric = line.textContent;
                }
            });
            currentLyricDisplay.textContent = currentLyric;

            let currentChord = '';
            structureContent.querySelectorAll('.structure-chord').forEach(chord => {
                const startBeat = parseInt(chord.dataset.beat) - 1;
                const spanLength = parseInt(chord.dataset.span) || 1;
                const endBeat = startBeat + spanLength - 1;
                chord.classList.toggle('active', currentBeat >= startBeat && currentBeat <= endBeat);
                chord.classList.toggle('passed', currentBeat > endBeat);
                if (currentBeat >= startBeat && currentBeat <= endBeat) {
                    currentChord = chord.querySelector('.chord').textContent;
                    const chordData = chordMap.get(currentChord) || { instructions: 'N/A' };
                    currentChordDisplay.textContent = currentChord;
                    chordInstructionsDisplay.textContent = chordData.instructions ? `${chordData.instructions}` : '';
                }
            });

            structureContent.querySelectorAll('.chord-progress').forEach(progress => {
                const progressBeat = parseInt(progress.dataset.beat) - 1;
                const spanLength = parseInt(progress.dataset.span) || 1;
                const beatStartTime = progressBeat * beatDuration;
                const beatEndTime = beatStartTime + (beatDuration * spanLength);
                let progressValue = 0;

                if (currentTime >= beatEndTime) {
                    progressValue = 100;
                } else if (currentTime >= beatStartTime && currentTime < beatEndTime) {
                    progressValue = Math.min(100, ((currentTime - beatStartTime) / (beatDuration * spanLength)) * 100);
                }

                progress.style.setProperty('--progress', progressValue);
            });

            requestAnimationFrame(updateProgressBars);
        }

        audio.addEventListener('timeupdate', () => {
            if (!audio.paused) {
                requestAnimationFrame(updateProgressBars);
            }
        });

        audio.addEventListener('ended', () => {
            playBtn.disabled = false;
            pauseBtn.disabled = true;
            seekBar.value = 0;
            seekBar.style.setProperty('--value', 0);
            currentLyricDisplay.textContent = '';
            currentChordDisplay.textContent = '';
            chordInstructionsDisplay.textContent = '';
            lyricsContent.querySelectorAll('.lyrics-line').forEach(line => {
                line.classList.remove('active');
                line.classList.add('passed');
            });
            structureContent.querySelectorAll('.structure-chord').forEach(chord => {
                chord.classList.remove('active');
                chord.classList.add('passed');
            });
            structureContent.querySelectorAll('.chord-progress').forEach(progress => progress.style.setProperty('--progress', 0));
        });

        audio.addEventListener('error', () => {
            console.error('Audio error:', audio.error);
        });
    })
    .catch(error => console.error('Error loading JSON:', error));

    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
    }
    </script>
</body>
