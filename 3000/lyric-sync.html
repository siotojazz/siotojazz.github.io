<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In a Race Against Time Во Трка со Времето Lyric Sync Editor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Astrella';
            src: url('../fonts/Astrella.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'UniversCnRg';
            src: url('resources/UniversCnRg.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        :root {
            --ink: #202124;
            --muted: #686b73;
            --line: #d7d2c8;
            --paper: #f7f5ef;
            --surface: #ffffff;
            --surface-2: #eee8dd;
            --accent: #1f7a75;
            --accent-2: #b24a3b;
            --accent-3: #d2ad39;
            --beat: rgba(32, 33, 36, 0.12);
            --bar: rgba(31, 122, 117, 0.42);
            --shadow: none;
            --waveform-h: 196px;
            --lyric-y: 226px;
            --chord-y: 390px;
            --section-y: 456px;
            --radius: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--paper);
            color: var(--ink);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            letter-spacing: 0;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            letter-spacing: 0;
        }

        button {
            border: 1px solid var(--line);
            border-radius: 0;
            background: var(--surface);
            color: var(--ink);
            min-height: 34px;
            padding: 0 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        button:hover {
            border-color: var(--accent);
        }

        button.primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        button.danger {
            border-color: rgba(178, 74, 59, 0.45);
            color: var(--accent-2);
        }

        button.icon {
            width: 34px;
            padding: 0;
            font-weight: 700;
        }

        button[aria-pressed="true"] {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 0;
            background: var(--surface);
            color: var(--ink);
            min-height: 34px;
            padding: 7px 9px;
        }

        input[type="checkbox"] {
            width: 18px;
            min-height: 18px;
            padding: 0;
        }

        input[type="range"] {
            min-height: 28px;
            padding: 0;
        }

        label {
            display: grid;
            gap: 5px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.2;
        }

        textarea {
            resize: vertical;
        }

        .sync-app {
            height: 100vh;
            display: grid;
            grid-template-columns: 286px minmax(0, 1fr);
        }

        .sidebar {
            min-width: 0;
            border-right: 1px solid var(--line);
            background: var(--surface);
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
        }

        .brand {
            padding: 18px 16px 12px;
            border-bottom: 1px solid var(--line);
        }

        .brand h1 {
            margin: 0;
            font-family: 'UniversCnRg', Inter, "Segoe UI", Arial, sans-serif;
            font-size: 25px;
            font-weight: 400;
            line-height: 1;
        }

        .album-title-block {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
        }

        .album-title-line {
            display: block;
            white-space: nowrap;
        }

        .album-title-line--en {
            font-size: 1em;
            letter-spacing: 0;
        }

        .album-title-line--mk {
            margin-top: 1px;
            font-size: 0.62em;
            letter-spacing: 0;
        }

        .album-tool-label {
            display: block;
            margin-top: 5px;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .brand p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        .file-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            padding: 12px;
            border-bottom: 1px solid var(--line);
        }

        .file-actions button:first-child,
        .file-actions button:last-child {
            grid-column: span 2;
        }

        .track-list {
            overflow: auto;
            padding: 8px;
        }

        .track-button {
            width: 100%;
            min-height: 42px;
            border: 0;
            border-radius: 0;
            background: transparent;
            display: grid;
            grid-template-columns: 28px minmax(0, 1fr);
            align-items: center;
            gap: 8px;
            text-align: left;
            color: var(--ink);
        }

        .track-button:hover {
            background: var(--surface-2);
        }

        .track-button.active {
            background: var(--ink);
            color: #fff;
        }

        .track-number {
            color: inherit;
            opacity: 0.68;
            font-size: 12px;
            text-align: right;
        }

        .track-title {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 700;
        }

        .workspace {
            min-width: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
        }

        .topbar {
            min-width: 0;
            border-bottom: 1px solid var(--line);
            background: rgba(247, 245, 239, 0.96);
            display: grid;
            grid-template-columns: minmax(230px, 1fr) auto;
            gap: 14px;
            align-items: center;
            padding: 10px 14px;
        }

        .track-heading {
            min-width: 0;
        }

        .track-heading h2 {
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 20px;
            line-height: 1.15;
        }

        .track-heading p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
        }

        .segmented {
            display: inline-flex;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 0;
            background: var(--surface);
        }

        .segmented button {
            border: 0;
            border-radius: 0;
            min-width: 58px;
        }

        .zoom-control {
            width: 150px;
        }

        .editor-grid {
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 354px;
        }

        .timeline-pane {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            background: var(--paper);
        }

        .transport {
            display: grid;
            grid-template-columns: auto auto minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            padding: 12px 14px;
        }

        .time-readout {
            font-variant-numeric: tabular-nums;
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
        }

        .seek-strip {
            height: 8px;
            background: var(--surface-2);
            overflow: hidden;
        }

        .seek-strip span {
            display: block;
            width: 0;
            height: 100%;
            background: var(--accent);
        }

        .status-pill {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .index-preview {
            min-height: 42px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 10px;
            align-items: center;
            padding: 8px 14px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: var(--surface);
        }

        .current-lyric {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--ink);
            font-size: 14px;
            opacity: 0.86;
        }

        .current-chord,
        .chord-instructions {
            white-space: nowrap;
            color: var(--ink);
            font-size: 12px;
            font-weight: 800;
        }

        .chord-instructions {
            color: var(--muted);
            font-weight: 500;
        }

        .timeline-scroll {
            min-width: 0;
            min-height: 0;
            overflow: auto;
            padding: 0;
            outline: none;
        }

        .timeline-inner {
            position: relative;
            min-width: 1180px;
            height: 466px;
            border: 1px solid var(--line);
            background: var(--surface);
            overflow: hidden;
            outline: none;
        }

        .timeline-inner canvas {
            position: absolute;
            left: 0;
            width: 100%;
            pointer-events: none;
        }

        #grid-canvas {
            top: 0;
            height: 100%;
        }

        #waveform-canvas {
            top: 0;
            height: var(--waveform-h);
        }

        .lane-label {
            position: absolute;
            left: 10px;
            width: 76px;
            height: 22px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.78);
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            pointer-events: none;
            z-index: 3;
        }

        .lane-label.lyrics {
            top: calc(var(--lyric-y) - 28px);
        }

        .lane-label.chords {
            top: calc(var(--chord-y) - 28px);
        }

        .lane-label.sections {
            top: calc(var(--section-y) - 28px);
        }

        .lane-rule {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--line);
            pointer-events: none;
            z-index: 2;
        }

        .lane-rule.lyrics {
            top: calc(var(--lyric-y) - 10px);
        }

        .lane-rule.chords {
            top: calc(var(--chord-y) - 10px);
        }

        .lane-rule.sections {
            top: calc(var(--section-y) - 10px);
        }

        .marker-layer,
        .section-layer {
            position: absolute;
            inset: 0;
            z-index: 4;
        }

        .marker {
            position: absolute;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            min-width: 26px;
            max-width: 460px;
            overflow: hidden;
            cursor: grab;
            user-select: none;
        }

        .marker:active {
            cursor: grabbing;
        }

        .marker.selected {
            outline: 2px solid var(--accent-3);
            outline-offset: 2px;
            z-index: 8;
        }

        .marker.dragging {
            opacity: 0.78;
            z-index: 12;
        }

        .marker.lyric {
            top: var(--lyric-y);
            height: 44px;
            align-items: flex-start;
            padding: 5px 7px;
            background: #fff5d6;
            border-color: #e2c75b;
            color: #43380e;
            font-size: 12px;
            line-height: 1.15;
            white-space: normal;
            word-break: break-word;
        }

        .marker.chord {
            top: var(--chord-y);
            height: 31px;
            justify-content: center;
            padding: 0 6px;
            background: #dff2ef;
            border-color: rgba(31, 122, 117, 0.32);
            color: #104946;
            font-size: 12px;
            font-weight: 800;
        }

        .start-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent-2);
            cursor: ew-resize;
            z-index: 9;
        }

        .start-handle::before {
            content: "Offset";
            position: absolute;
            top: 9px;
            left: 7px;
            height: 24px;
            display: grid;
            place-items: center;
            padding: 0 8px;
            background: var(--accent-2);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .drop-preview {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent-3);
            z-index: 13;
            pointer-events: none;
        }

        .drop-preview::before {
            content: "";
            position: absolute;
            left: -6px;
            top: 0;
            width: 14px;
            height: 100%;
            background: rgba(210, 173, 57, 0.16);
            border-left: 1px solid var(--accent-3);
            border-right: 1px solid var(--accent-3);
        }

        .drop-preview span {
            position: absolute;
            top: 26px;
            left: 8px;
            height: 22px;
            padding: 3px 7px;
            background: var(--accent-3);
            color: var(--ink);
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--ink);
            opacity: 0.82;
            z-index: 10;
            pointer-events: none;
        }

        .playhead::before {
            content: "";
            position: absolute;
            left: -5px;
            top: 0;
            width: 12px;
            height: 12px;
            background: var(--ink);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
        }

        .section-band {
            position: absolute;
            top: var(--section-y);
            height: 36px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            background: rgba(32, 33, 36, 0.08);
            border: 1px solid rgba(32, 33, 36, 0.08);
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        .empty-state {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 28px;
            text-align: center;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.72);
            z-index: 14;
        }

        .inspector {
            min-height: 0;
            border-left: 1px solid var(--line);
            background: var(--surface);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            overflow: hidden;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-bottom: 1px solid var(--line);
        }

        .tabs button {
            border: 0;
            border-radius: 0;
            background: transparent;
        }

        .tabs button.active {
            background: var(--ink);
            color: #fff;
        }

        .panel-scroll {
            min-height: 0;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px;
        }

        .panel {
            display: none;
            gap: 12px;
        }

        .panel.active {
            display: grid;
            align-content: start;
        }

        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .field-grid .wide {
            grid-column: 1 / -1;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .lyric-list,
        .chord-grid {
            display: grid;
            gap: 8px;
        }

        .lyric-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 48px 50px 56px 34px;
            gap: 6px;
            align-items: center;
            padding: 7px;
            border: 1px solid var(--line);
            background: var(--paper);
        }

        .lyric-row.selected,
        .chord-cell.selected {
            border-color: var(--accent-3);
            outline: 2px solid rgba(210, 173, 57, 0.42);
            outline-offset: -2px;
        }

        .lyric-row input {
            min-height: 30px;
            padding: 5px 7px;
            font-size: 12px;
        }

        .lyric-row .mini {
            color: var(--muted);
            font-size: 11px;
        }

        .chord-grid {
            grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
        }

        .chord-cell {
            min-width: 0;
            border: 1px solid var(--line);
            background: var(--paper);
            padding: 6px;
            display: grid;
            gap: 4px;
        }

        .chord-cell span {
            color: var(--muted);
            font-size: 10px;
            font-variant-numeric: tabular-nums;
        }

        .chord-cell input {
            min-height: 28px;
            padding: 4px 6px;
            text-align: center;
            font-weight: 800;
            font-size: 12px;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: min(720px, 100vw);
            height: 100vh;
            background: var(--surface);
            border-left: 1px solid var(--line);
            transform: translateX(100%);
            transition: transform 0.2s ease;
            z-index: 30;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-bottom: 1px solid var(--line);
        }

        .drawer-head h2 {
            margin: 0;
            font-size: 18px;
        }

        .drawer-body {
            min-height: 0;
            overflow: auto;
            padding: 14px;
            display: grid;
            gap: 14px;
        }

        .metadata-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .metadata-grid .wide {
            grid-column: 1 / -1;
        }

        #json-editor {
            min-height: 430px;
            font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
            font-size: 12px;
            line-height: 1.45;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 1020px) {
            .sync-app {
                grid-template-columns: 230px minmax(0, 1fr);
            }

            .editor-grid {
                grid-template-columns: minmax(0, 1fr);
            }

            .inspector {
                border-left: 0;
                border-top: 1px solid var(--line);
                min-height: 360px;
            }
        }

        @media (max-width: 760px) {
            body {
                overflow: auto;
            }

            .sync-app {
                min-height: 100vh;
                height: auto;
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: 340px;
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .topbar {
                grid-template-columns: 1fr;
            }

            .toolbar {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="sync-app">
        <aside class="sidebar">
            <div class="brand">
                <h1 id="album-heading">
                    <span class="album-title-block">
                        <span class="album-title-line album-title-line--en">In a Race Against Time</span>
                        <span class="album-title-line album-title-line--mk">Во Трка со Времето</span>
                    </span>
                    <span class="album-tool-label">Sync</span>
                </h1>
                <p id="source-label">album.json</p>
            </div>
            <div class="file-actions">
                <button id="open-file" type="button"><i class="fa-solid fa-folder-open" aria-hidden="true"></i><span>Open album.json</span></button>
                <button id="save-file" class="primary" type="button"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save album.json</span></button>
                <button id="download-file" type="button"><i class="fa-solid fa-download" aria-hidden="true"></i><span>Download</span></button>
                <button id="data-menu" type="button"><i class="fa-solid fa-sliders" aria-hidden="true"></i><span>Data</span></button>
            </div>
            <div class="track-list" id="track-list" aria-label="Tracks"></div>
        </aside>

        <main class="workspace">
            <header class="topbar">
                <div class="track-heading">
                    <h2 id="track-heading">No track loaded</h2>
                    <p id="track-meta">Waiting for album.json</p>
                </div>
                <div class="toolbar">
                    <div class="segmented" aria-label="Snap mode">
                        <button id="snap-beat" type="button" aria-pressed="true" title="Snap drag targets to beats">Beat</button>
                        <button id="snap-bar" type="button" aria-pressed="false" title="Snap drag targets to bars">Bar</button>
                    </div>
                    <label class="zoom-control">
                        Zoom
                        <input id="zoom" type="range" min="6" max="36" step="1" value="14">
                    </label>
                </div>
            </header>

            <section class="editor-grid">
                <div class="timeline-pane">
                    <div class="transport">
                        <button id="play-toggle" class="icon" type="button" title="Play or pause" disabled><i class="fa-solid fa-play" aria-hidden="true"></i></button>
                        <div class="time-readout" id="time-readout">0:00.000 / 0:00.000</div>
                        <div class="seek-strip" aria-hidden="true"><span id="seek-progress"></span></div>
                        <div class="status-pill" id="status-label">Idle</div>
                    </div>

                    <div class="index-preview" aria-label="Current index page lyric display">
                        <span class="current-lyric" id="current-lyric-display"></span>
                        <span class="current-chord" id="current-chord-display"></span>
                        <span class="chord-instructions" id="chord-instructions-display"></span>
                    </div>

                    <div class="timeline-scroll" id="timeline-scroll">
                        <div class="timeline-inner" id="timeline-inner" tabindex="0">
                            <canvas id="grid-canvas"></canvas>
                            <canvas id="waveform-canvas"></canvas>
                            <div class="lane-label lyrics">Lyrics</div>
                            <div class="lane-label chords">Chords</div>
                            <div class="lane-label sections">Sections</div>
                            <div class="lane-rule lyrics"></div>
                            <div class="lane-rule chords"></div>
                            <div class="lane-rule sections"></div>
                            <div class="section-layer" id="section-layer"></div>
                            <div class="marker-layer" id="marker-layer"></div>
                            <div class="start-handle" id="start-handle" title="Start offset"></div>
                            <div class="drop-preview hidden" id="drop-preview"><span id="drop-preview-label"></span></div>
                            <div class="playhead" id="playhead"></div>
                            <div class="empty-state hidden" id="empty-state">Open album.json to begin.</div>
                        </div>
                    </div>
