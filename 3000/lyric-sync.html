<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lyric Sync — Sioto Jazz</title>
    <style>
        @font-face {
            font-family: "Univers";
            src: url("resources/UniversRegular.ttf") format("truetype");
            font-display: swap;
        }

        :root {
            color-scheme: dark;
            --ink: #f3f0e8;
            --muted: #8d8c88;
            --line: rgba(243, 240, 232, 0.15);
            --accent: #d9ff45;
            --bg: #0d0e0f;
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Univers", Arial, sans-serif;
        }

        button, select { font: inherit; }

        main {
            width: min(760px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0 72px;
        }

        header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 6vw, 54px);
            font-weight: 400;
            letter-spacing: -0.055em;
        }

        .save {
            flex: none;
            border: 0;
            border-radius: 999px;
            padding: 11px 18px;
            background: var(--ink);
            color: var(--bg);
            cursor: pointer;
        }

        .save:hover { background: var(--accent); }
        .save:disabled { cursor: default; opacity: 0.35; }

        label {
            display: block;
            margin-bottom: 20px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        select {
            display: block;
            width: 100%;
            margin-top: 8px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 13px 42px 13px 14px;
            background: #151617;
            color: var(--ink);
        }

        audio {
            display: block;
            width: 100%;
            margin-bottom: 32px;
        }

        .instruction {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .instruction kbd {
            border: 1px solid var(--line);
            border-bottom-color: rgba(243, 240, 232, 0.35);
            border-radius: 4px;
            padding: 2px 7px;
            background: #18191a;
            color: var(--ink);
            font: inherit;
        }

        .now {
            width: 100%;
            min-height: 108px;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 22px;
            background: transparent;
            color: var(--ink);
            font: inherit;
            text-align: center;
            font-size: clamp(22px, 5vw, 38px);
            line-height: 1.15;
            outline: none;
            transition: border-color 100ms, background 100ms, color 100ms;
        }

        .now:focus { border-color: rgba(217, 255, 69, 0.65); }
        .now:disabled { opacity: 1; }

        body.holding .now {
            border-color: var(--accent);
            background: var(--accent);
            color: #111;
        }

        .line-tools {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .line-tools button {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 12px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
        }

        .line-tools button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        .line-tools button:disabled { cursor: default; opacity: 0.3; }

        .status {
            min-height: 22px;
            margin: 10px 2px 22px;
            color: var(--muted);
            font-size: 13px;
        }

        .lyrics {
            border-top: 1px solid var(--line);
        }

        .line {
            width: 100%;
            display: grid;
            grid-template-columns: 36px 1fr auto;
            gap: 12px;
            align-items: baseline;
            border: 0;
            border-bottom: 1px solid var(--line);
            padding: 13px 2px;
            background: transparent;
            color: var(--muted);
            text-align: left;
            cursor: pointer;
        }

        .line .number,
        .line .time {
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        .line .time { opacity: 0.7; }
        .line.done { color: rgba(243, 240, 232, 0.42); }
        .line.current { color: var(--ink); }
        .line.current .number { color: var(--accent); }
        .line.current .text { font-size: 18px; }
        body.holding .line.current {
            border-color: var(--accent);
            background: var(--accent);
            color: #111;
        }
        body.holding .line.current .number { color: #111; }
        .line:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

        .empty {
            padding: 48px 0;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 520px) {
            main { width: min(100% - 22px, 760px); padding-top: 24px; }
            header { align-items: center; }
            .save { padding: 9px 13px; }
            .line { grid-template-columns: 28px 1fr; }
            .line .time { display: none; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Lyric sync</h1>
            <button class="save" id="save" type="button" disabled>Save album.json</button>
        </header>

        <label>
            Song
            <select id="track" disabled><option>Loading album.json…</option></select>
        </label>

        <audio id="audio" controls preload="metadata"></audio>

        <p class="instruction">Play the song. Hold <kbd>Space</kbd> while the highlighted line is sung.</p>
        <input class="now" id="now" type="text" value="Loading…" aria-label="Current lyric line">
        <div class="line-tools">
            <button id="cut-line" type="button" disabled>Cut at cursor</button>
            <button id="merge-line" type="button" disabled>Merge next</button>
        </div>
        <p class="status" id="status" role="status">Loading album.json…</p>
        <div class="lyrics" id="lyrics"></div>
    </main>

    <script>
        const ui = {
            track: document.querySelector("#track"),
            audio: document.querySelector("#audio"),
            now: document.querySelector("#now"),
            cutLine: document.querySelector("#cut-line"),
            mergeLine: document.querySelector("#merge-line"),
            status: document.querySelector("#status"),
            lyrics: document.querySelector("#lyrics"),
            save: document.querySelector("#save")
        };

        let album;
        let trackIndex = 0;
        let lineIndex = 0;
        let pressTime = null;
        let dirty = false;

        const tracks = () => Array.isArray(album?.tracks) ? album.tracks : [];
        const currentTrack = () => tracks()[trackIndex] || null;
        const currentLyrics = () => Array.isArray(currentTrack()?.lyrics) ? currentTrack().lyrics : [];
        const finite = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
        const round = value => Math.round(value * 1000) / 1000;

        function normalizeLine(value) {
            let text = String(value || "").trim();
            text = text.replace(/[\p{P}]+$/gu, punctuation => {
                return [...punctuation]
                    .filter(character => /[?？؟()（）]/u.test(character))
                    .join("")
                    .replace(/[?？؟]+/gu, questionMarks => questionMarks[0]);
            }).trimEnd();
            return text.replace(/\p{L}/u, letter => letter.toLocaleUpperCase("mk-MK"));
        }

        function normalizeAllLyrics() {
            let changed = false;
            tracks().forEach(track => {
                if (!Array.isArray(track.lyrics)) return;
                track.lyrics.forEach(lyric => {
                    const normalized = normalizeLine(lyric.line);
                    if (normalized !== String(lyric.line || "")) {
                        lyric.line = normalized;
                        changed = true;
                    }
                });
            });
            return changed;
        }

        function timing(track) {
            const bpm = Math.max(1, finite(track?.tempo, 120));
            const signature = String(track?.timeSignature || "4/4").trim();
            const numerator = Number.parseInt(signature, 10) || 4;
            const beatsPerBar = signature === "6/8" ? 2 : numerator;
            const beatDuration = signature === "6/8" ? (60 / bpm) * 1.5 : 60 / bpm;
            return {
                barDuration: beatDuration * beatsPerBar,
                startOffset: finite(track?.startOffset, 0)
            };
        }

        function lyricStart(track, lyric) {
            const clock = timing(track);
            return clock.startOffset + finite(lyric?.barNumber) * clock.barDuration + finite(lyric?.offset);
        }

        function formatTime(value) {
            const seconds = Math.max(0, finite(value));
            const minutes = Math.floor(seconds / 60);
            return `${minutes}:${String(Math.floor(seconds % 60)).padStart(2, "0")}.${String(Math.floor((seconds % 1) * 10))}`;
        }

        function writeStart(lyric, time) {
            const clock = timing(currentTrack());
            const relative = Math.max(0, time - clock.startOffset);
            lyric.barNumber = Math.floor(relative / clock.barDuration);
            lyric.offset = round(relative - lyric.barNumber * clock.barDuration);
        }

        function writeLength(lyric, start, end) {
            const duration = Math.max(0.08, end - start);
            lyric.barLength = round(duration / timing(currentTrack()).barDuration);
        }

        function lyricEnd(track, lyric) {
            return lyricStart(track, lyric) + finite(lyric?.barLength, 1) * timing(track).barDuration;
        }

        function writeTimingFromSeconds(track, lyric, start, end) {
            const clock = timing(track);
            const relative = Math.max(0, start - clock.startOffset);
            lyric.barNumber = Math.floor(relative / clock.barDuration);
            lyric.offset = round(relative - lyric.barNumber * clock.barDuration);
            lyric.barLength = round(Math.max(0.08, end - start) / clock.barDuration);
        }

        function render() {
            const lyrics = currentLyrics();
            ui.lyrics.replaceChildren();

            if (!lyrics.length) {
                ui.now.value = "No lyrics in this song";
                ui.now.disabled = true;
                ui.cutLine.disabled = true;
                ui.mergeLine.disabled = true;
                ui.lyrics.innerHTML = '<div class="empty">Choose a song that has lyrics.</div>';
                return;
            }

            if (lineIndex >= lyrics.length) {
                ui.now.value = "Finished";
                ui.now.disabled = true;
                ui.cutLine.disabled = true;
                ui.mergeLine.disabled = true;
                ui.status.textContent = "All lines synced. Save album.json.";
            } else {
                ui.now.disabled = false;
                ui.now.value = lyrics[lineIndex].line || "";
                ui.cutLine.disabled = (lyrics[lineIndex].line || "").length < 2;
                ui.mergeLine.disabled = lineIndex >= lyrics.length - 1;
            }

            lyrics.forEach((lyric, index) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = `line${index < lineIndex ? " done" : ""}${index === lineIndex ? " current" : ""}`;
                button.dataset.index = index;

                const number = document.createElement("span");
                number.className = "number";
                number.textContent = String(index + 1).padStart(2, "0");

                const text = document.createElement("span");
                text.className = "text";
                text.textContent = lyric.line || "(empty line)";

                const stamp = document.createElement("span");
                stamp.className = "time";
                stamp.textContent = index < lineIndex ? formatTime(lyricStart(currentTrack(), lyric)) : "";

                button.append(number, text, stamp);
                ui.lyrics.append(button);
            });

            requestAnimationFrame(() => {
                ui.lyrics.querySelector(".current")?.scrollIntoView({ block: "center", behavior: "smooth" });
            });
        }

        function chooseTrack(index) {
            trackIndex = Math.max(0, Math.min(tracks().length - 1, index));
            lineIndex = 0;
            pressTime = null;
            document.body.classList.remove("holding");
            const track = currentTrack();
            ui.audio.src = track?.mp3 || track?.wav || "";
            ui.status.textContent = currentLyrics().length ? "Ready for line 1." : "This song has no lyrics.";
            render();
        }

        function isTyping(target) {
            return target instanceof HTMLInputElement
                || target instanceof HTMLTextAreaElement
                || target instanceof HTMLSelectElement
                || target === ui.save;
        }

        window.addEventListener("keydown", event => {
            if (event.code !== "Space" || isTyping(event.target)) return;
            event.preventDefault();
            if (event.repeat) return;
            const lyric = currentLyrics()[lineIndex];
            if (!lyric) return;
            if (ui.audio.paused) {
                ui.status.textContent = "Play the song first.";
                return;
            }

            pressTime = ui.audio.currentTime;
            writeStart(lyric, pressTime);
            document.body.classList.add("holding");
            ui.status.textContent = `Holding line ${lineIndex + 1}…`;
        });

        window.addEventListener("keyup", event => {
            if (event.code !== "Space" || pressTime === null) return;
            event.preventDefault();
            const lyric = currentLyrics()[lineIndex];
            if (!lyric) return;

            writeLength(lyric, pressTime, ui.audio.currentTime);
            pressTime = null;
            lineIndex += 1;
            dirty = true;
            ui.save.disabled = false;
            document.body.classList.remove("holding");
            ui.status.textContent = lineIndex < currentLyrics().length
                ? `Line ${lineIndex} synced. Ready for line ${lineIndex + 1}.`
                : "All lines synced. Save album.json.";
            render();
        });

        ui.track.addEventListener("change", () => chooseTrack(Number(ui.track.value)));

        ui.now.addEventListener("input", () => {
            const lyric = currentLyrics()[lineIndex];
            if (!lyric) return;
            lyric.line = ui.now.value;
            dirty = true;
            ui.save.disabled = false;
            ui.cutLine.disabled = ui.now.value.length < 2;
            const rowText = ui.lyrics.querySelector(`.line[data-index="${lineIndex}"] .text`);
            if (rowText) rowText.textContent = lyric.line || "(empty line)";
            ui.status.textContent = `Line ${lineIndex + 1} edited.`;
        });

        ui.now.addEventListener("blur", () => {
            const lyric = currentLyrics()[lineIndex];
            if (!lyric) return;
            const normalized = normalizeLine(ui.now.value);
            if (normalized === lyric.line) return;
            lyric.line = normalized;
            dirty = true;
            ui.save.disabled = false;
            render();
            ui.status.textContent = `Line ${lineIndex + 1} formatted.`;
        });

        ui.cutLine.addEventListener("click", () => {
            const lyrics = currentLyrics();
            const lyric = lyrics[lineIndex];
            if (!lyric) return;
            const cursor = ui.now.selectionStart;
            const text = ui.now.value;
            if (!Number.isInteger(cursor) || cursor <= 0 || cursor >= text.length) {
                ui.status.textContent = "Place the cursor where this line should be cut.";
                ui.now.focus();
                return;
            }

            const firstText = normalizeLine(text.slice(0, cursor));
            const secondText = normalizeLine(text.slice(cursor));
            if (!firstText || !secondText) {
                ui.status.textContent = "The cut needs text on both sides.";
                ui.now.focus();
                return;
            }

            const track = currentTrack();
            const start = lyricStart(track, lyric);
            const end = lyricEnd(track, lyric);
            const split = start + (end - start) * (firstText.length / (firstText.length + secondText.length));
            const second = { ...lyric, line: secondText };
            lyric.line = firstText;
            delete lyric.stanzaEnd;
            writeTimingFromSeconds(track, lyric, start, split);
            writeTimingFromSeconds(track, second, split, end);
            lyrics.splice(lineIndex + 1, 0, second);
            dirty = true;
            ui.save.disabled = false;
            ui.status.textContent = `Line ${lineIndex + 1} cut into two lines.`;
            render();
        });

        ui.mergeLine.addEventListener("click", () => {
            const lyrics = currentLyrics();
            const lyric = lyrics[lineIndex];
            const next = lyrics[lineIndex + 1];
            if (!lyric || !next) return;

            const track = currentTrack();
            const start = Math.min(lyricStart(track, lyric), lyricStart(track, next));
            const end = Math.max(lyricEnd(track, lyric), lyricEnd(track, next));
            lyric.line = normalizeLine([lyric.line, next.line].map(value => String(value || "").trim()).filter(Boolean).join(" "));
            if (lyric.stanzaEnd || next.stanzaEnd) lyric.stanzaEnd = true;
            else delete lyric.stanzaEnd;
            writeTimingFromSeconds(track, lyric, start, end);
            lyrics.splice(lineIndex + 1, 1);
            dirty = true;
            ui.save.disabled = false;
            ui.status.textContent = `Lines ${lineIndex + 1} and ${lineIndex + 2} merged.`;
            render();
        });

        ui.lyrics.addEventListener("click", event => {
            const row = event.target.closest(".line");
            if (!row) return;
            lineIndex = Number(row.dataset.index);
            ui.status.textContent = `Ready for line ${lineIndex + 1}.`;
            render();
        });

        ui.save.addEventListener("click", async () => {
            if (normalizeAllLyrics()) render();
            const json = `${JSON.stringify(album, null, 2)}\n`;
            try {
                if ("showSaveFilePicker" in window) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: "album.json",
                        types: [{ description: "Album JSON", accept: { "application/json": [".json"] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(json);
                    await writable.close();
                } else {
                    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
                    const link = document.createElement("a");
                    link.href = url;
                    link.download = "album.json";
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                }
                dirty = false;
                ui.save.disabled = true;
                ui.status.textContent = "album.json saved.";
            } catch (error) {
                if (error?.name !== "AbortError") ui.status.textContent = "Could not save album.json.";
            }
        });

        window.addEventListener("beforeunload", event => {
            if (!dirty) return;
            event.preventDefault();
            event.returnValue = "";
        });

        fetch("album.json", { cache: "no-store" })
            .then(response => {
                if (!response.ok) throw new Error(`album.json: ${response.status}`);
                return response.json();
            })
            .then(data => {
                album = data;
                album.tracks = tracks().slice().sort((a, b) => finite(a.id, 999) - finite(b.id, 999));
                dirty = normalizeAllLyrics();
                ui.track.replaceChildren();
                tracks().forEach((track, index) => {
                    const option = document.createElement("option");
                    option.value = index;
                    option.textContent = `${String(finite(track.id, index + 1)).padStart(2, "0")} — ${track.title || "Untitled"}`;
                    ui.track.append(option);
                });
                ui.track.disabled = false;
                ui.save.disabled = !dirty;
                chooseTrack(0);
                if (dirty) ui.status.textContent = "Lyrics formatted. Save album.json to keep the changes.";
            })
            .catch(error => {
                console.error(error);
                ui.now.value = "Could not load album.json";
                ui.status.textContent = "Open this page through the site’s local web server.";
            });
    </script>
</body>
</html>
