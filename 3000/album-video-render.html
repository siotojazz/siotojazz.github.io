<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sioto Jazz full album video render</title>
    <style>
        @font-face {
            font-family: "Garet";
            src: url("../fonts/Garet.ttf") format("truetype");
            font-display: block;
            font-weight: 400 600;
        }

        @font-face {
            font-family: "Garet";
            src: url("../fonts/Garet-Heavy.ttf") format("truetype");
            font-display: block;
            font-weight: 700 900;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #07398f;
        }

        body {
            display: grid;
            place-items: center;
        }

        #album-video-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #07398f;
        }

        #album-video-status {
            position: fixed;
            left: 12px;
            bottom: 10px;
            z-index: 2;
            margin: 0;
            color: #fff;
            font: 13px/1.3 "Garet", Arial, sans-serif;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        body.is-ready #album-video-status {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="album-video-canvas" width="1920" height="1080" aria-label="Full album video frame"></canvas>
    <p id="album-video-status">Preparing album timeline…</p>
    <script type="module" src="js/album-video-render.js"></script>
</body>
</html>
