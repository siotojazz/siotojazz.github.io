                frame.appendChild(scaleHandle);

                node.appendChild(frame);
                els.layers.appendChild(node);
                slotNodes.set(slot.id, node);
                return node;
            }

            function renderStage() {
                const stageSize = els.coverStage.getBoundingClientRect().width || 1;
                els.coverStage.style.background = state.background;
                els.emptyNote.classList.toggle('hidden', state.images.length > 0);

                state.slots.forEach((slot) => {
                    const node = ensureSlotNode(slot);
                    const rect = slotRect(slot, stageSize);
                    const image = imageById(slot.imageId);
                    const frame = node.querySelector('.slot-frame');
                    const img = frame.querySelector('img');
                    const empty = node.querySelector('.slot-empty');

                    node.classList.toggle('selected', slot.id === state.selectedSlotId);
                    node.style.left = `${(rect.x / stageSize) * 100}%`;
                    node.style.top = `${(rect.y / stageSize) * 100}%`;
                    node.style.width = `${(rect.width / stageSize) * 100}%`;
                    node.style.height = `${(rect.height / stageSize) * 100}%`;
                    empty.textContent = slot.label;

                    if (!image) {
                        frame.classList.add('hidden');
                        empty.classList.remove('hidden');
                        img.removeAttribute('src');
                        return;
                    }

                    const dims = slotFrameDimensions(slot, image, stageSize);
                    frame.classList.remove('hidden');
                    empty.classList.add('hidden');
                    if (img.src !== image.url) {
                        img.src = image.url;
                        img.alt = image.fileName;
                    }
                    frame.style.left = `${50 + slot.offsetX}%`;
                    frame.style.top = `${50 + slot.offsetY}%`;
                    frame.style.width = `${dims.width}px`;
                    frame.style.height = `${dims.height}px`;
                    frame.style.transform = `translate(-50%, -50%) rotate(${slot.rotation}deg)`;
                });

                els.countText.textContent = `${assignedSlotCount()} / ${state.slots.length} slots filled`;
            }

            function renderStrip() {
                const stageSize = els.coverStage.getBoundingClientRect().width || 1;
                const stripHeight = stageSize * (state.strip.height / 100);

                els.titleStrip.style.top = `${state.strip.y}%`;
                els.titleStrip.style.height = `${state.strip.height}%`;
                els.titleStrip.style.transform = 'translateY(-50%)';
                els.stripBand.textContent = state.text.band || ' ';
                els.stripAlbum.textContent = state.text.album || ' ';
                els.stripBand.style.left = `${state.text.bandX}%`;
                els.stripAlbum.style.left = `${state.text.albumX}%`;
                els.stripBand.style.fontSize = `${stageSize * (state.text.bandSize / 100)}px`;
                els.stripAlbum.style.fontSize = `${stageSize * (state.text.albumSize / 100)}px`;

                fitDomText(els.stripBand, maxTextWidthForX(state.text.bandX, stageSize), stageSize * (state.text.bandSize / 100), 12);
                fitDomText(els.stripAlbum, maxTextWidthForX(state.text.albumX, stageSize), stageSize * (state.text.albumSize / 100), 10);
                els.titleStrip.style.minHeight = `${Math.max(24, stripHeight)}px`;
            }

            function maxTextWidthForX(x, stageSize) {
                const edgeRoom = Math.min(x, 100 - x) / 100 * stageSize * 2 - stageSize * 0.04;
                return clamp(edgeRoom, stageSize * 0.14, stageSize * 0.52);
            }

            function fitDomText(element, maxWidth, startingSize, minimumSize) {
                let size = startingSize;
                element.style.maxWidth = `${maxWidth}px`;
                element.style.fontSize = `${size}px`;
                while (element.scrollWidth > maxWidth && size > minimumSize) {
                    size *= 0.96;
                    element.style.fontSize = `${size}px`;
                }
            }

            function renderSlotList() {
                els.layerList.innerHTML = '';

                state.slots.forEach((slot) => {
                    const image = imageById(slot.imageId);
                    const row = document.createElement('button');
                    row.type = 'button';
                    row.className = `layer-row${slot.id === state.selectedSlotId ? ' selected' : ''}`;
                    row.dataset.id = slot.id;

                    const thumb = document.createElement('span');
                    thumb.className = 'layer-thumb';
                    if (image) {
                        const img = document.createElement('img');
                        img.src = image.url;
                        img.alt = '';
                        thumb.appendChild(img);
                    }

                    const name = document.createElement('span');
                    name.className = 'layer-name';
                    name.textContent = `${slot.label}: ${image ? image.fileName : 'empty'}`;

                    row.append(thumb, name);
                    els.layerList.appendChild(row);
                });
            }

            function renderImageOptions(slot) {
                els.slotImageSelect.innerHTML = '';

                if (!state.images.length) {
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = 'No images loaded';
                    els.slotImageSelect.appendChild(option);
                    els.slotImageSelect.disabled = true;
                    return;
                }

                const noneOption = document.createElement('option');
                noneOption.value = '';
                noneOption.textContent = 'Empty slot';
                els.slotImageSelect.appendChild(noneOption);

                state.images.forEach((image, index) => {
                    const option = document.createElement('option');
                    option.value = image.id;
                    option.textContent = `${index + 1}. ${image.fileName}`;
                    els.slotImageSelect.appendChild(option);
                });

                els.slotImageSelect.disabled = !slot;
                els.slotImageSelect.value = slot && slot.imageId ? slot.imageId : '';
            }

            function renderInspector() {
                const slot = selectedSlot();
                const image = slot ? imageById(slot.imageId) : null;
                const slotIndex = slot ? state.slots.indexOf(slot) : -1;
                const hasImage = Boolean(image);

                els.selectionName.textContent = slot ? `${slot.label}: ${image ? image.fileName : 'empty'}` : 'No slot selected';
                renderImageOptions(slot);

                [els.xInput, els.yInput, els.scaleInput, els.rotationInput, els.xNumber, els.yNumber, els.scaleNumber, els.rotationNumber, els.centerButton, els.fillButton, els.resetButton].forEach((control) => {
                    control.disabled = !hasImage;
                });
                els.duplicateButton.disabled = !slot || !state.images.length;
                els.removeButton.disabled = !hasImage;
                els.backwardButton.disabled = slotIndex <= 0;
                els.forwardButton.disabled = slotIndex < 0 || slotIndex >= state.slots.length - 1;

                if (!slot || !hasImage) {
                    setPairedValue(els.xInput, els.xNumber, 0);
                    setPairedValue(els.yInput, els.yNumber, 0);
                    setPairedValue(els.scaleInput, els.scaleNumber, 1);
                    setPairedValue(els.rotationInput, els.rotationNumber, 0);
                    els.xValue.textContent = '0%';
                    els.yValue.textContent = '0%';
                    els.scaleValue.textContent = '100%';
                    els.rotationValue.textContent = '0 deg';
                    return;
                }

                setPairedValue(els.xInput, els.xNumber, slot.offsetX);
                setPairedValue(els.yInput, els.yNumber, slot.offsetY);
                setPairedValue(els.scaleInput, els.scaleNumber, slot.scale);
                setPairedValue(els.rotationInput, els.rotationNumber, normalizeRotation(slot.rotation));
                els.xValue.textContent = formatPercent(slot.offsetX, 1);
                els.yValue.textContent = formatPercent(slot.offsetY, 1);
                els.scaleValue.textContent = formatPercent(slot.scale * 100, 0);
                els.rotationValue.textContent = `${Math.round(normalizeRotation(slot.rotation))} deg`;
            }

            function normalizeRotation(value) {
                let rotation = value % 360;
                if (rotation > 180) {
                    rotation -= 360;
                }
                if (rotation < -180) {
                    rotation += 360;
                }
                return rotation;
            }

            function updateStripControls() {
                state.strip.y = Number(els.stripYInput.value);
                state.strip.height = Number(els.stripHeightInput.value);
                state.layout.gap = Number(els.slotGapInput.value);
                state.text.bandX = Number(els.bandXInput.value);
                state.text.albumX = Number(els.albumXInput.value);
                state.text.bandSize = Number(els.bandSizeInput.value);
                state.text.albumSize = Number(els.albumSizeInput.value);
                els.stripYValue.textContent = formatPercent(state.strip.y, state.strip.y % 1 ? 1 : 0);
                els.stripHeightValue.textContent = formatPercent(state.strip.height, state.strip.height % 1 ? 1 : 0);
                els.slotGapValue.textContent = formatPercent(state.layout.gap, state.layout.gap % 1 ? 1 : 0);
                els.bandXValue.textContent = formatPercent(state.text.bandX, state.text.bandX % 1 ? 1 : 0);
                els.albumXValue.textContent = formatPercent(state.text.albumX, state.text.albumX % 1 ? 1 : 0);
                els.bandSizeValue.textContent = formatPercent(state.text.bandSize, 1);
                els.albumSizeValue.textContent = formatPercent(state.text.albumSize, 1);
                render();
            }

            function updateSelectedSlotFromInputs() {
                const slot = selectedSlot();
                if (!slot || !slot.imageId) {
                    return;
                }

                slot.offsetX = Number(els.xInput.value);
                slot.offsetY = Number(els.yInput.value);
                slot.scale = Number(els.scaleInput.value);
                slot.rotation = Number(els.rotationInput.value);
                render();
            }

            function selectSlot(id) {
                if (state.slots.some((slot) => slot.id === id)) {
                    state.selectedSlotId = id;
                    render();
                }
            }

            function assignImageToSelectedSlot(imageId) {
                const slot = selectedSlot();
                if (!slot) {
                    return;
                }

                if (slot.imageId !== imageId) {
                    slot.imageId = imageId || null;
                    resetSlotTransform(slot);
                }
                setStatus(imageId ? `${slot.label} assigned` : `${slot.label} cleared`);
                render();
            }

            function clearSelectedSlot() {
                const slot = selectedSlot();
                if (!slot) {
                    return;
                }

                slot.imageId = null;
                resetSlotTransform(slot);
                setStatus(`${slot.label} cleared`);
                render();
            }

            function cycleSelectedSlotImage() {
                const slot = selectedSlot();
                if (!slot || !state.images.length) {
                    return;
                }

                const currentIndex = state.images.findIndex((image) => image.id === slot.imageId);
                const nextImage = state.images[(currentIndex + 1 + state.images.length) % state.images.length];
                slot.imageId = nextImage.id;
                resetSlotTransform(slot);
                setStatus(`${slot.label}: ${nextImage.fileName}`);
                render();
            }

            function clearAll() {
                const urls = new Set(state.images.map((image) => image.url));
                urls.forEach((url) => URL.revokeObjectURL(url));
                state.images = [];
                state.slots.forEach((slot) => {
                    slot.imageId = null;
                    resetSlotTransform(slot);
                });
                setStatus('All images cleared');
                render();
            }

            function selectAdjacentSlot(direction) {
                const slot = selectedSlot();
                const index = state.slots.indexOf(slot);
                const next = state.slots[clamp(index + direction, 0, state.slots.length - 1)];
                if (next) {
                    state.selectedSlotId = next.id;
                    render();
                }
            }

            function centerSelectedSlot() {
                const slot = selectedSlot();
                if (!slot || !slot.imageId) {
                    return;
                }

                slot.offsetX = 0;
                slot.offsetY = 0;
                render();
            }

            function fitSelectedSlot() {
                const slot = selectedSlot();
                if (!slot || !slot.imageId) {
                    return;
                }

                slot.offsetX = 0;
                slot.offsetY = 0;
                slot.scale = 1;
                slot.rotation = 0;
                render();
            }

            function resetSelectedSlot() {
                const slot = selectedSlot();
                if (!slot || !slot.imageId) {
                    return;
                }

                resetSlotTransform(slot);
                render();
            }

            function beginPointer(event) {
                const slotNode = event.target.closest('.slot');
                if (!slotNode) {
                    return;
                }

                const slot = state.slots.find((item) => item.id === slotNode.dataset.id);
                if (!slot) {
                    return;
                }

                event.preventDefault();
                state.selectedSlotId = slot.id;

                if (!slot.imageId) {
                    render();
                    return;
                }

                const rect = slotNode.getBoundingClientRect();
                const center = {
                    x: rect.left + rect.width * (0.5 + slot.offsetX / 100),
                    y: rect.top + rect.height * (0.5 + slot.offsetY / 100)
                };
                const action = event.target.dataset.handle || 'move';
                const startAngle = Math.atan2(event.clientY - center.y, event.clientX - center.x) * 180 / Math.PI;
                const startDistance = Math.hypot(event.clientX - center.x, event.clientY - center.y);

                activePointer = {
                    pointerId: event.pointerId,
                    action,
                    slot,
                    rect,
                    startClientX: event.clientX,
                    startClientY: event.clientY,
                    startOffsetX: slot.offsetX,
                    startOffsetY: slot.offsetY,
                    startScale: slot.scale,
                    startRotation: slot.rotation,
                    center,
                    startAngle,
                    startDistance: Math.max(12, startDistance)
                };

                slotNode.setPointerCapture(event.pointerId);
                render();
            }

            function movePointer(event) {
                if (!activePointer || event.pointerId !== activePointer.pointerId) {
                    return;
                }

                event.preventDefault();
                const slot = activePointer.slot;

                if (activePointer.action === 'move') {
                    const dx = ((event.clientX - activePointer.startClientX) / activePointer.rect.width) * 100;
                    const dy = ((event.clientY - activePointer.startClientY) / activePointer.rect.height) * 100;
                    slot.offsetX = clamp(activePointer.startOffsetX + dx, -70, 70);
                    slot.offsetY = clamp(activePointer.startOffsetY + dy, -70, 70);
                } else if (activePointer.action === 'scale') {
                    const distance = Math.hypot(event.clientX - activePointer.center.x, event.clientY - activePointer.center.y);
                    slot.scale = clamp(activePointer.startScale * (distance / activePointer.startDistance), 0.1, 4);
                } else if (activePointer.action === 'rotate') {
                    const angle = Math.atan2(event.clientY - activePointer.center.y, event.clientX - activePointer.center.x) * 180 / Math.PI;
                    slot.rotation = normalizeRotation(activePointer.startRotation + angle - activePointer.startAngle);
                }

                queueRender();
            }

            function endPointer(event) {
                if (!activePointer || event.pointerId !== activePointer.pointerId) {
                    return;
                }

                activePointer = null;
                render();
            }

            function handleKeydown(event) {
                const slot = selectedSlot();
                const tagName = document.activeElement ? document.activeElement.tagName : '';
                const inField = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tagName);
                if (!slot || inField) {
                    return;
                }

                if ((event.key === 'Delete' || event.key === 'Backspace') && slot.imageId) {
                    event.preventDefault();
                    clearSelectedSlot();
                    return;
                }

                if (!slot.imageId) {
                    return;
                }

                const step = event.shiftKey ? 4 : 1;
                if (event.key === 'ArrowLeft') {
                    event.preventDefault();
                    slot.offsetX = clamp(slot.offsetX - step, -70, 70);
                    render();
                } else if (event.key === 'ArrowRight') {
                    event.preventDefault();
                    slot.offsetX = clamp(slot.offsetX + step, -70, 70);
                    render();
                } else if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    slot.offsetY = clamp(slot.offsetY - step, -70, 70);
                    render();
                } else if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    slot.offsetY = clamp(slot.offsetY + step, -70, 70);
                    render();
                }
            }

            async function loadFonts() {
                if (!document.fonts) {
                    return;
                }

                await Promise.allSettled([
                    document.fonts.load('180px Astrella'),
                    document.fonts.load('84px UniversCnRg')
                ]);
                await document.fonts.ready;
            }

            function setCanvasFont(ctx, size, family) {
                ctx.font = `${size}px "${family}", Arial, Helvetica, sans-serif`;
            }

            function fitCanvasText(ctx, text, startingSize, family, maxWidth, minimumSize) {
                let size = startingSize;
                setCanvasFont(ctx, size, family);
                while (ctx.measureText(text).width > maxWidth && size > minimumSize) {
                    size *= 0.96;
                    setCanvasFont(ctx, size, family);
                }
                return size;
            }

            function drawSlot(ctx, slot, size) {
                const image = imageById(slot.imageId);
                const rect = slotRect(slot, size);

                ctx.save();
                ctx.beginPath();
                ctx.rect(rect.x, rect.y, rect.width, rect.height);
                ctx.clip();

                if (image) {
                    const dims = slotFrameDimensions(slot, image, size);
                    const centerX = rect.x + rect.width * (0.5 + slot.offsetX / 100);
                    const centerY = rect.y + rect.height * (0.5 + slot.offsetY / 100);
                    ctx.translate(centerX, centerY);
                    ctx.rotate(slot.rotation * Math.PI / 180);
                    ctx.drawImage(image.image, -dims.width / 2, -dims.height / 2, dims.width, dims.height);
                }

                ctx.restore();
            }

            function drawTitleStrip(ctx, size) {
                const stripHeight = size * (state.strip.height / 100);
                const stripCenter = size * (state.strip.y / 100);
                const stripTop = stripCenter - stripHeight / 2;
                const textY = stripCenter;
                const bandText = (state.text.band || '').toUpperCase();
                const albumText = (state.text.album || '').toUpperCase();

                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, stripTop, size, stripHeight);
                ctx.fillStyle = '#111111';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                fitCanvasText(ctx, bandText, size * (state.text.bandSize / 100), 'Astrella', maxTextWidthForX(state.text.bandX, size), size * 0.012);
                ctx.fillText(bandText, size * (state.text.bandX / 100), textY);

                fitCanvasText(ctx, albumText, size * (state.text.albumSize / 100), 'UniversCnRg', maxTextWidthForX(state.text.albumX, size), size * 0.008);
                ctx.fillText(albumText, size * (state.text.albumX / 100), textY);
                ctx.restore();
            }

            async function exportPng() {
                const size = clamp(Number(els.sizeInput.value) || 3000, 1000, 9000);
                els.sizeInput.value = String(size);
                setStatus(`Rendering ${size} x ${size}`);
                els.exportButton.disabled = true;

                await loadFonts();

                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d', { alpha: false });
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.fillStyle = state.background;
                ctx.fillRect(0, 0, size, size);

                state.slots.forEach((slot) => drawSlot(ctx, slot, size));
                drawTitleStrip(ctx, size);

                canvas.toBlob((blob) => {
                    els.exportButton.disabled = false;
                    if (!blob) {
                        setStatus('Export failed');
                        return;
                    }

                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    const safeAlbum = (state.text.album || 'cover').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cover';
                    link.href = url;
                    link.download = `${safeAlbum}-${size}.png`;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    setStatus(`Exported ${size} x ${size} PNG`);
                }, 'image/png');
            }

            function bindEvents() {
                els.folderButton.addEventListener('click', () => els.folderInput.click());
                els.fileButton.addEventListener('click', () => els.fileInput.click());
                els.folderInput.addEventListener('change', (event) => {
                    addFiles(event.target.files);
                    event.target.value = '';
                });
                els.fileInput.addEventListener('change', (event) => {
                    addFiles(event.target.files);
                    event.target.value = '';
                });
                els.shuffleButton.addEventListener('click', autoFillSlots);
                els.clearButton.addEventListener('click', clearAll);
                els.exportButton.addEventListener('click', exportPng);

                els.bandInput.addEventListener('input', () => {
                    state.text.band = els.bandInput.value;
                    renderStrip();
                });
                els.albumInput.addEventListener('input', () => {
                    state.text.album = els.albumInput.value;
                    renderStrip();
                });
                bindSliderNumber(els.stripYInput, els.stripYNumber, updateStripControls);
                bindSliderNumber(els.stripHeightInput, els.stripHeightNumber, updateStripControls);
                bindSliderNumber(els.slotGapInput, els.slotGapNumber, updateStripControls);
                bindSliderNumber(els.bandXInput, els.bandXNumber, updateStripControls);
                bindSliderNumber(els.albumXInput, els.albumXNumber, updateStripControls);
                bindSliderNumber(els.bandSizeInput, els.bandSizeNumber, updateStripControls);
                bindSliderNumber(els.albumSizeInput, els.albumSizeNumber, updateStripControls);
                els.backgroundInput.addEventListener('input', () => {
                    state.background = els.backgroundInput.value;
                    renderStage();
                });
                els.slotImageSelect.addEventListener('change', () => {
                    assignImageToSelectedSlot(els.slotImageSelect.value);
                });
                bindSliderNumber(els.xInput, els.xNumber, updateSelectedSlotFromInputs);
                bindSliderNumber(els.yInput, els.yNumber, updateSelectedSlotFromInputs);
                bindSliderNumber(els.scaleInput, els.scaleNumber, updateSelectedSlotFromInputs);
                bindSliderNumber(els.rotationInput, els.rotationNumber, updateSelectedSlotFromInputs);

                els.layerList.addEventListener('click', (event) => {
                    const row = event.target.closest('.layer-row');
                    if (row) {
                        selectSlot(row.dataset.id);
                    }
                });

                els.layers.addEventListener('pointerdown', beginPointer);
                document.addEventListener('pointermove', movePointer);
                document.addEventListener('pointerup', endPointer);
                document.addEventListener('pointercancel', endPointer);
                document.addEventListener('keydown', handleKeydown);
                window.addEventListener('resize', render);

                els.coverStage.addEventListener('dragover', (event) => {
                    event.preventDefault();
                    els.coverStage.classList.add('is-dragover');
                });
                els.coverStage.addEventListener('dragleave', () => {
                    els.coverStage.classList.remove('is-dragover');
                });
                els.coverStage.addEventListener('drop', (event) => {
                    event.preventDefault();
                    els.coverStage.classList.remove('is-dragover');
                    addFiles(event.dataTransfer.files);
                });

                els.backwardButton.addEventListener('click', () => selectAdjacentSlot(-1));
                els.forwardButton.addEventListener('click', () => selectAdjacentSlot(1));
                els.duplicateButton.addEventListener('click', cycleSelectedSlotImage);
                els.removeButton.addEventListener('click', clearSelectedSlot);
                els.centerButton.addEventListener('click', centerSelectedSlot);
                els.fillButton.addEventListener('click', fitSelectedSlot);
                els.resetButton.addEventListener('click', resetSelectedSlot);
            }

            bindEvents();
            updateStripControls();
            loadFonts().then(render).catch(render);
        })();
    </script>
</body>
</html>
